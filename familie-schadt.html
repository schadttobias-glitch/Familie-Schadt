async function sRzKI(){
  const name=document.getElementById("rzn")?.value.trim();
  if(!name){alert("Bitte Namen eingeben!");return;}
  const emoji=document.getElementById("rze")?.value.trim()||"";
  const dauer=document.getElementById("rzd")?.value.trim()||"?";
  const katV=document.getElementById("rzkat")?.value||"mittagessen";

  const schritte=(document.getElementById("rzsc2")?.value||"").split("\n").map(s=>s.trim()).filter(s=>s);

  if(kil)kil.style.display="block";
  document.querySelector("#rff .sb").disabled=true;
  let kc=0,p=0,vc=0,fe=0,ca=0,tipp="Selbst gekochtes Essen schmeckt am besten!";
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:300,
        messages:[{role:"user",content:"Schaetze Naehrwerte pro Portion fuer 4 Personen:\nName: "+name+"\nZutaten: "+zutaten.join(", ")+"\nAntworte NUR mit JSON (kein Markdown):\n{\"kcal\":ZAHL,\"protein_g\":ZAHL,\"vitaminC_mg\":ZAHL,\"eisen_mg\":ZAHL,\"calcium_mg\":ZAHL,\"tipp\":\"Kurzer Ernaehrungstipp max 80 Zeichen\"}"}]})
    });
    const data=await res.json();
    if(data.content?.[0]?.text){
      const j=JSON.parse(data.content[0].text.replace(/```json|```/g,"").trim());
      kc=j.kcal||0;p=j.protein_g||0;vc=j.vitaminC_mg||0;fe=j.eisen_mg||0;ca=j.calcium_mg||0;tipp=j.tipp||tipp;
    }

  if(kil)kil.style.display="none";
  S.mr.unshift({id:"m"+Date.now(),name,emoji,dauer,kat:katV,zutaten,schritte,tipp,kc,p,vc,fe,ca});
  S.showRF=false;S.rzKat="eigene";sv();rRezepte();
}
