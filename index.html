<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#764ba2">
<title>Familie Schadt</title>
<style>
:root{--cb:#fff;--cb2:#f8f8ff;--ib:#fff;--hb:#f5f5f5;--sb:#f0f0f0;--t1:#222;--t2:#666;--t3:#999;--t4:#ccc;--bd:#eee;--bd2:#f5f5f5;--dg:#ffebee}
body.dark{--cb:#1e1e2e;--cb2:#242438;--ib:#242438;--hb:#2a2a3e;--sb:#2a2a3e;--t1:#e8e8f0;--t2:#a8a8bc;--t3:#8888a0;--t4:#5a5a72;--bd:#33334a;--bd2:#2c2c42;--dg:#3a1f28}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
.card{background:var(--cb);color:var(--t1);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
.ct{color:#764ba2;font-weight:800;font-size:12px;margin-bottom:8px}
.tag{border-radius:7px;padding:2px 7px;font-size:10px;font-weight:700}
.bw{background:var(--sb);border-radius:6px;height:8px;overflow:hidden}
.bf{height:100%;border-radius:6px}
.sb{width:100%;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;border-radius:9px;padding:9px;font-weight:800;font-size:13px;margin-top:5px;cursor:pointer}
.fi{width:100%;padding:7px 10px;border-radius:8px;border:2px solid var(--bd);background:var(--ib);color:var(--t1);font-size:12px;margin-bottom:5px}
.dlb{background:var(--dg);color:#f44336;border:none;border-radius:6px;width:28px;height:28px;font-size:13px;font-weight:800;cursor:pointer}
.tb{flex:0 0 auto;padding:6px 8px;border-radius:9px;border:none;background:transparent;color:white;font-weight:700;font-size:9.5px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.tb span{font-size:13px}
.tb.on{background:white;color:#764ba2}
.si{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd2);align-items:center;cursor:pointer}
.chkbox{min-width:19px;height:19px;border-radius:5px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:white}
.chkbox.on{background:#764ba2;border-color:#764ba2}
.wr{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start}
.wt{display:flex;flex-wrap:wrap;gap:3px}
.wtg{border-radius:6px;padding:1px 6px;font-size:10px;font-weight:600}
.spk{border-radius:13px;padding:11px 13px;margin-bottom:7px;border-left:5px solid}
.sg{display:grid;grid-template-columns:38px repeat(5,1fr);gap:2px;font-size:9px}
.sc{border-radius:4px;padding:3px 2px;text-align:center;font-weight:600;min-height:30px;display:flex;align-items:center;justify-content:center;line-height:1.2}
.sh{background:#764ba2;color:white;font-weight:800}
.sm{background:var(--cb2);color:#764ba2;font-weight:700;font-size:8px}
.sf{color:white;font-weight:700}
.ff{background:transparent!important;color:var(--t4)!important}
.fd{background:#2e7d32}.fm{background:#1565c0}.fe2{background:#6a1b9a}
.fsk{background:#e65100}.fk{background:#ad1457}.fsp{background:#00695c}
.fmu{background:#4527a0}.fr{background:#37474f}.fw{background:#5d4037}
.fc{border-radius:13px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;background:var(--cb);color:var(--t1);box-shadow:0 3px 12px rgba(0,0,0,0.08)}
.pin-btn{width:70px;height:70px;border-radius:50%;background:white;border:3px solid #e0e0e0;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,0.1)}
.ktask{background:white;border-radius:18px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.doneBtn{color:white;border:none;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:900;cursor:pointer;flex-shrink:0}
.task-row{background:var(--cb);color:var(--t1);border-radius:13px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 12px rgba(0,0,0,0.08)}
.award{background:linear-gradient(135deg,#f57f17,#ff9800);color:white;border:none;border-radius:9px;padding:7px 11px;font-size:11px;font-weight:800;flex-shrink:0;cursor:pointer}
.profbtn{border:none;border-radius:20px;padding:18px 12px;font-weight:900;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,0.25);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex:1}
.screen{display:none;min-height:100vh}
.eb{background:rgba(255,255,255,0.15);border-radius:13px;padding:16px;color:white;text-align:center;font-size:12px}
@media print{
  #day-row,#tab-row,button,input[type=file]{display:none!important}
  body{background:white;padding-bottom:0}
  .card,.fc,.task-row{background:white!important;color:#222!important;box-shadow:none!important;border:1px solid #ddd}
  #scr-app{padding-bottom:0}
}
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="scr-start" class="screen" style="background:linear-gradient(135deg,#667eea,#764ba2);flex-direction:column;align-items:center;justify-content:center;padding:24px;display:flex">
  <div style="font-size:52px;margin-bottom:8px">&#127807;</div>
  <div style="color:white;font-size:24px;font-weight:900;margin-bottom:4px">Familie Schadt</div>
  <div style="color:rgba(255,255,255,0.8);font-size:13px;margin-bottom:32px">Wer bist du?</div>
  <div style="display:flex;gap:10px;width:100%;max-width:320px;margin-bottom:12px">
    <button class="profbtn" style="background:linear-gradient(135deg,#1565c0,#42a5f5);color:white" data-goto-eltern="1">
      <span style="font-size:36px">&#129492;</span>Tobi
    </button>
    <button class="profbtn" style="background:linear-gradient(135deg,#ad1457,#f06292);color:white" data-goto-eltern="1">
      <span style="font-size:36px">&#128105;</span>Eva
    </button>
  </div>
  <div style="display:flex;gap:10px;width:100%;max-width:320px">
    <button class="profbtn" style="background:linear-gradient(135deg,#ff6b6b,#feca57);color:#333" data-goto-kind="alia">
      <span style="font-size:36px">&#128103;</span>Alia
    </button>
    <button class="profbtn" style="background:linear-gradient(135deg,#48dbfb,#ff9ff3);color:#333" data-goto-kind="tiana">
      <span style="font-size:36px">&#129306;</span>Tiana
    </button>
  </div>
</div>

<!-- PIN SCREEN -->
<div id="scr-pin" class="screen" style="background:linear-gradient(135deg,#667eea,#764ba2);flex-direction:column;align-items:center;justify-content:center;padding:24px">
  <div style="font-size:36px;margin-bottom:10px">&#128274;</div>
  <div style="color:white;font-size:20px;font-weight:900;margin-bottom:4px">Eltern-Bereich</div>
  <div style="color:rgba(255,255,255,0.8);font-size:13px;margin-bottom:20px">PIN eingeben</div>
  <div id="pin-dots" style="display:flex;gap:12px;margin-bottom:20px"></div>
  <div id="pin-grid" style="display:grid;grid-template-columns:repeat(3,70px);gap:10px;margin-bottom:12px"></div>
  <div id="pin-err" style="color:#ff6b6b;font-size:13px;font-weight:700;height:20px;margin-bottom:8px"></div>
  <button data-goto-start="1" style="color:rgba(255,255,255,0.7);background:none;border:none;font-size:13px;cursor:pointer">Abbrechen</button>
</div>

<!-- KIDS SCREEN -->
<div id="scr-kids" class="screen">
  <div id="kids-content"></div>
  <div style="position:fixed;bottom:0;left:0;right:0;padding:10px 14px;background:rgba(255,255,255,0.97);display:flex;gap:8px;box-shadow:0 -3px 15px rgba(0,0,0,0.1)">
    <button id="ktb-s" data-ktab="s" style="flex:1;padding:10px;border-radius:11px;border:none;background:linear-gradient(135deg,#f57f17,#ff9800);color:white;font-weight:800;font-size:12px;cursor:pointer">&#11088; Sterne</button>
    <button id="ktb-a" data-ktab="a" style="flex:1;padding:10px;border-radius:11px;border:2px solid #eee;background:white;color:#555;font-weight:800;font-size:12px;cursor:pointer">&#9989; Aufgaben</button>
    <button id="ktb-e" data-ktab="e" style="flex:1;padding:10px;border-radius:11px;border:2px solid #eee;background:white;color:#555;font-weight:800;font-size:12px;cursor:pointer">&#127869; Essen</button>
    <button data-goto-start="1" style="padding:10px 13px;border-radius:11px;border:2px solid #eee;background:white;color:#555;font-weight:800;font-size:12px;cursor:pointer">&#8592;</button>
  </div>
</div>

<!-- APP SCREEN -->
<div id="scr-app" class="screen" style="background:linear-gradient(135deg,#667eea,#764ba2);padding-bottom:70px">
  <div style="background:rgba(255,255,255,0.18);padding:13px 12px 10px;color:white;display:flex;justify-content:space-between;align-items:center">
    <div>
      <div style="font-size:17px;font-weight:900">&#127807; Familie Schadt</div>
      <div style="font-size:11px;opacity:.85;margin-top:1px">&#129492; Tobi &middot; &#128105; Eva &middot; &#128103; Alia &middot; &#129306; Tiana</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <div id="hbb" style="background:rgba(255,255,255,0.2);border-radius:9px;padding:4px 9px;font-size:11px;font-weight:700;color:white">Woche</div>
      <button data-toggle-dark="1" style="background:rgba(255,255,255,0.2);border:none;border-radius:8px;padding:5px 8px;color:white;font-size:11px;font-weight:700;cursor:pointer">&#127769;</button>
      <button data-goto-start="1" style="background:rgba(255,255,255,0.2);border:none;border-radius:8px;padding:5px 8px;color:white;font-size:11px;font-weight:700;cursor:pointer">&#8962;</button>
    </div>
  </div>
  <div id="day-row" style="display:flex;gap:5px;padding:7px 10px 4px;overflow-x:auto;scrollbar-width:none"></div>
  <div id="week-row" style="display:flex;align-items:center;justify-content:center;gap:8px;color:white;font-size:11px;font-weight:700;padding:0 10px 5px"></div>
  <div id="tab-row" style="display:flex;margin:4px 10px;background:rgba(255,255,255,0.15);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none">
    <button class="tb on" data-tab="plan"><span>&#127869;</span>Essen</button>
    <button class="tb" data-tab="sterne"><span>&#11088;</span>Sterne</button>
    <button class="tb" data-tab="schule"><span>&#127890;</span>Schule</button>
    <button class="tb" data-tab="termine"><span>&#128197;</span>Termine</button>
    <button class="tb" data-tab="einkauf"><span>&#128722;</span>Einkauf</button>
    <button class="tb" data-tab="sport"><span>&#127939;</span>Sport</button>
  </div>
  <div style="padding:0 10px">
    <div id="t-plan"></div>
    <div id="t-sterne" style="display:none"></div>
    <div id="t-schule" style="display:none"></div>
    <div id="t-termine" style="display:none"></div>
    <div id="t-einkauf" style="display:none"></div>
    <div id="t-sport" style="display:none"></div>
  </div>
</div>

function findRecipe(id) {

// WOCHEN-HELFER
function isoDate(d) { return d.toISOString().slice(0,10); }
function mondayOf(d) { const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
function weekKey(d) { return isoDate(mondayOf(d)); }
function viewMonday() { const m=mondayOf(new Date()); m.setDate(m.getDate()+W.weekOffset*7); return m; }
function viewDate(dayIndex) { const d=new Date(viewMonday()); d.setDate(d.getDate()+dayIndex); return d; }
function curWeekKey() { return weekKey(viewMonday()); }
function fmtDshort(d) { return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."; }
function migrateMealOv() {
  if (W.mealOv && Object.keys(W.mealOv).length) {
    const wk = weekKey(new Date());
    if (!W.weekOv) W.weekOv = {};
    if (!W.weekOv[wk]) W.weekOv[wk] = {};
    Object.entries(W.mealOv).forEach(([k,v]) => { if (!(k in W.weekOv[wk])) W.weekOv[wk][k] = v; });
    W.mealOv = {};
    sv();
  }
}
function findDefaultRecipeId(i, slot) {
  const name = PLAN[i][slot], kat = SLOT_KAT[slot];
  const r = RECIPES[kat] && RECIPES[kat].items.find(x => x.name === name);
  return r ? r.id : null;
}
function getMeal(i, slot) {
  const key = i+"-"+slot, wk = curWeekKey();
  const base = {n:PLAN[i][slot], kc:PLAN[i][slot+"kc"], p:PLAN[i][slot+"p"], vc:PLAN[i][slot+"vc"], fe:PLAN[i][slot+"fe"], ca:PLAN[i][slot+"ca"], rid:findDefaultRecipeId(i, slot)};
  const ov = W.weekOv[wk] && W.weekOv[wk][key];
  if (ov === undefined) return base;
  const r = findRecipe(ov);
  if (r) return {n:r.name, kc:r.kc, p:r.p, vc:r.vc, fe:r.fe, ca:r.ca, rid:r.id};
  // Legacy: vor der Rezeptliste konnte hier nur ein reiner Textname gespeichert werden.
  return {...base, n:ov, rid:null};
}
function setMealOv(key, val) {
  const wk = curWeekKey();
  if (!W.weekOv[wk]) W.weekOv[wk] = {};
  if (val === "") delete W.weekOv[wk][key]; else W.weekOv[wk][key] = val;
}
function onMealSelect(key, val) {
  if (val === "__new__") { W.mealNewForm = key; sv(); rPlan(); return; }
  setMealOv(key, val);
  W.mealNewForm = null; W.mealEdit = null; sv(); rPlan();
}
function saveNewRecipe(key) {
  const slot = key.split("-")[1], kat = SLOT_KAT[slot];
  const name = document.getElementById("nrn_"+key)?.value.trim();
  if (!name) return;
  const zutText = document.getElementById("nrz_"+key)?.value.trim() || "";
  const rec = {
    id: "u"+Date.now(), name, kat,
    kc: Number(document.getElementById("nrkc_"+key)?.value)||0,
    p: Number(document.getElementById("nrp_"+key)?.value)||0,
    vc: Number(document.getElementById("nrvc_"+key)?.value)||0,
    fe: Number(document.getElementById("nrfe_"+key)?.value)||0,
    ca: Number(document.getElementById("nrca_"+key)?.value)||0,
    zutaten: zutText ? zutText.split("\n").map(z=>z.trim()).filter(z=>z) : [],
  };
  if (!W.customRecipes) W.customRecipes = [];
  W.customRecipes.push(rec);
  setMealOv(key, rec.id);
  W.mealNewForm = null; W.mealEdit = null;
  sv(); rPlan();
}
function getPlanIngredients() {
  const seen = new Set(), out = [];
  for (let di=0; di<7; di++) {
    ["f","m","a","s"].forEach(slot => {
      const meal = getMeal(di, slot);
      const r = meal.rid ? findRecipe(meal.rid) : null;
      if (r && r.zutaten) r.zutaten.forEach(z => { const k=z.trim().toLowerCase(); if(!seen.has(k)){seen.add(k);out.push(z);} });
    });
  }
  return out;
}

function exportBackup() {

  a.href = url; a.download = "familie-schadt-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importBackup(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      W = {...W, ...parsed};
      sv();
      alert("Backup wiederhergestellt!");
      location.reload();
    } catch(e) { alert("Diese Datei konnte nicht gelesen werden."); }
  };
  reader.readAsText(file);
}
function shareOrCopy(title, text) {
  if (navigator.share) { navigator.share({title, text}).catch(()=>{}); }
  else if (navigator.clipboard) { navigator.clipboard.writeText(text).then(()=>alert("In Zwischenablage kopiert!")); }
  else alert(text);
}

let pinBuf = "";
function renderPinUI() {
  const dots = document.getElementById("pin-dots");

  if (!dots || !grid) return;
  dots.innerHTML = [0,1,2,3].map(i =>
    `<div style="width:16px;height:16px;border-radius:50%;background:${i<pinBuf.length?"white":"rgba(255,255,255,0.3)"};border:2px solid white"></div>`
  ).join("");
  grid.innerHTML = ["1","2","3","4","5","6","7","8","9","","0","X"].map(b =>
    b ? `<button class="pin-btn" data-pin="${b}">${b==="X"?"&#9003;":b}</button>` : `<div></div>`
  ).join("");
}
function pinKey(k) {
  if (k==="X") { pinBuf=pinBuf.slice(0,-1); renderPinUI(); return; }
  pinBuf += k;
  renderPinUI();
  if (pinBuf.length >= 4) {
    if (pinBuf === W.pin) {
      showScr("app"); renderDays(); renderCurrent();
    } else {
      const e = document.getElementById("pin-err");
      if (e) e.textContent = "Falscher PIN!";
      setTimeout(() => { pinBuf=""; renderPinUI(); if(e) e.textContent=""; }, 1000);
    }
  }
}

  const colors = { s:"linear-gradient(135deg,#f57f17,#ff9800)", a:"linear-gradient(135deg,#4caf50,#2e7d32)", e:"linear-gradient(135deg,#667eea,#764ba2)" };
  ["s","a","e"].forEach(x => {
    const b = document.getElementById("ktb-"+x);
    if (!b) return;
    const on = x===W.ktab;
    b.style.background = on ? colors[x] : "white";
    b.style.color = on ? "white" : "#555";
    b.style.border = on ? "none" : "2px solid #eee";
  });
}
function renderKids() {
  const kid=W.sk, isA=kid==="alia", name=isA?"Alia":"Tiana";
  const bg=isA?"linear-gradient(135deg,#ff6b6b,#feca57,#48dbfb)":"linear-gradient(135deg,#ff9ff3,#feca57,#48dbfb)";
  const st=W.stars[kid]||0, tasks=W.tasks[kid]||[];
  const p = PLAN[W.day];
  let h = `<div style="min-height:100vh;background:${bg};padding:16px 14px 90px">`;
  h += `<div style="text-align:center;padding:12px 0 16px"><div style="font-size:44px">${isA?"&#128103;":"&#129306;"}</div><div style="font-size:24px;font-weight:900;color:white;text-shadow:0 2px 8px rgba(0,0,0,0.2)">Hallo ${name}!</div></div>`;

  if (W.ktab==="s") {
    h += `<div style="background:rgba(255,255,255,0.92);border-radius:22px;padding:20px;text-align:center;margin-bottom:12px;box-shadow:0 8px 25px rgba(0,0,0,0.15)">`;
    h += `<div style="font-size:15px;font-weight:800;color:#555;margin-bottom:6px">Meine Sterne</div>`;
    h += `<div style="font-size:68px;font-weight:900;color:#f57f17;line-height:1">${st}</div>`;
    h += `<div style="font-size:28px;letter-spacing:3px;margin-top:8px">${Array(Math.min(st,10)).fill("&#11088;").join("")}${st>10?" +"+(st-10):""}</div>`;
    h += `</div>`;
    const nr = DEF_REW.filter(r=>r.s>st).sort((a,b)=>a.s-b.s)[0];
    if (nr) {
      const pc = Math.round(st/nr.s*100);
      h += `<div style="background:rgba(255,255,255,0.92);border-radius:18px;padding:14px;margin-bottom:12px"><div style="font-size:13px;font-weight:800;color:#555;margin-bottom:8px">Naechste Belohnung: ${nr.n}</div><div class="bw" style="height:14px"><div class="bf" style="width:${pc}%;background:linear-gradient(90deg,#f57f17,#ff9800)"></div></div><div style="font-size:11px;color:#888;text-align:center;margin-top:4px">${st} von ${nr.s} Sternen</div></div>`;
    }
    const pend = (W.reqs||[]).filter(r=>r.kid===kid&&r.status==="pending");
    if (pend.length) {
      h += `<div style="background:rgba(255,255,255,0.92);border-radius:18px;padding:14px;margin-bottom:12px"><div style="font-size:13px;font-weight:800;color:#e65100;margin-bottom:8px">&#9203; Warten auf Mama/Papa</div>`;
      pend.forEach(r => { h += `<div style="font-size:13px;color:#555;padding:4px 0">${r.tn}</div>`; });
      h += `</div>`;
    }
  } else if (W.ktab==="a") {
    h += `<div style="font-size:18px;font-weight:900;color:white;text-shadow:0 2px 6px rgba(0,0,0,0.2);margin-bottom:10px">Meine Aufgaben</div>`;
    tasks.forEach(t => {
      const pr = (W.reqs||[]).some(r=>r.kid===kid&&r.tid===t.id&&r.status==="pending");
      h += `<div class="ktask"><div style="flex:1"><div style="font-size:16px;font-weight:800;color:#333">${t.n}</div><div style="font-size:12px;color:#888;margin-top:2px">${t.s} Stern${t.s>1?"e":""}</div></div>`;
      if (pr) {
        h += `<div class="doneBtn" style="background:#bdbdbd">&#9203; Warten</div>`;
      } else {
        h += `<button class="doneBtn" style="background:linear-gradient(135deg,#4caf50,#2e7d32)" data-req-task="1" data-kid="${kid}" data-tid="${t.id}" data-tn="${t.n}" data-s="${t.s}">Erledigt!</button>`;
      }
      h += `</div>`;
    });
  } else {
    h += `<div style="font-size:18px;font-weight:900;color:white;text-shadow:0 2px 6px rgba(0,0,0,0.2);margin-bottom:10px">Was esse ich heute?</div>`;
    [{lb:"Fruehstueck",n:p.f},{lb:"Mittagessen",n:p.m},{lb:"Abendessen",n:p.a},{lb:"Snack",n:p.s}].forEach(x => {
      h += `<div style="background:rgba(255,255,255,0.92);border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:0 3px 12px rgba(0,0,0,0.1)"><div style="font-size:12px;color:#764ba2;font-weight:800;margin-bottom:3px">${x.lb}</div><div style="font-size:16px;font-weight:700;color:#333">${x.n}</div></div>`;
    });
  }
  h += `</div>`;
  const kc = document.getElementById("kids-content");
  if (kc) kc.innerHTML = h;
}

function reqTask(kid, tid, tn, s) {
  if (!W.reqs) W.reqs = [];
  W.reqs.push({id:Date.now(), kid, tid, tn, s, status:"pending"});
  sv(); renderKids();
  alert("Super! Mama oder Papa bestaetigt das gleich!");
}

// APP
function renderDays() {
  const nf = gNF()[0];
  const hb = document.getElementById("hbb");
  if (hb && nf) { const du=dU(nf.v); hb.textContent=du<=0?"Ferien!":du<=14?nf.n+" in "+du+"d":"Woche"; }
  const dr = document.getElementById("day-row");
  if (!dr) return;
  dr.innerHTML = DAYS.map((d,i) => {
    const on = W.day===i;
    const hasDot = W.rec.some(r=>r.day===d);
    return `<button data-day="${i}" style="min-width:40px;height:44px;border-radius:10px;border:none;background:${on?"white":"rgba(255,255,255,0.2)"};color:${on?"#764ba2":"white"};font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0;cursor:pointer">${d}${hasDot?`<span style="width:4px;height:4px;border-radius:50%;background:${on?"#e91e63":"rgba(255,255,255,0.7)"}"></span>`:""}</button>`;
  }).join("");
  rWeekNav();
}
function rWeekNav() {
  const wr = document.getElementById("week-row");
  if (!wr) return;
  const mon=viewMonday(), sun=new Date(mon); sun.setDate(sun.getDate()+6);
  const lbl=(W.weekOffset===0?"Diese Woche: ":W.weekOffset===1?"Naechste Woche: ":W.weekOffset===-1?"Letzte Woche: ":"")+fmtDshort(mon)+" - "+fmtDshort(sun);
  wr.innerHTML = `<button data-week-nav="-1" style="background:rgba(255,255,255,0.2);border:none;color:white;border-radius:7px;width:22px;height:22px;font-weight:800;cursor:pointer">&#8249;</button><span>${lbl}</span>`
    + (W.weekOffset!==0 ? `<button data-week-reset="1" style="background:rgba(255,255,255,0.2);border:none;color:white;border-radius:7px;padding:2px 8px;font-size:10px;font-weight:700;cursor:pointer">Heute</button>` : ``)
    + `<button data-week-nav="1" style="background:rgba(255,255,255,0.2);border:none;color:white;border-radius:7px;width:22px;height:22px;font-weight:800;cursor:pointer">&#8250;</button>`;
}

function setTab(name) {
  W.tab = name; sv();
  document.querySelectorAll("[data-tab]").forEach(b => { b.classList.toggle("on", b.dataset.tab===name); });
  ["plan","sterne","schule","termine","einkauf","sport"].forEach(t => {
    const el = document.getElementById("t-"+t);
    if (el) el.style.display = t===name?"block":"none";
  });
  renderCurrent();
}

function renderCurrent() {
  if (W.tab==="plan") rPlan();
  else if (W.tab==="sterne") rSterne();
  else if (W.tab==="schule") rSchule();
  else if (W.tab==="termine") rTermine();
  else if (W.tab==="einkauf") rEinkauf();
  else if (W.tab==="sport") rSport();
}

// PLAN
function rPlan() {
  const p=PLAN[W.day], pn=pN(W.day);
  let h = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><div style="color:white;font-weight:800;font-size:15px">${DAYSF[W.day]}</div><div style="display:flex;gap:5px"><button data-share-plan="1" style="background:white;color:#764ba2;border:none;border-radius:9px;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer">Teilen</button><button onclick="window.print()" style="background:rgba(255,255,255,0.2);color:white;border:none;border-radius:9px;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer">Drucken</button></div></div>`;
  if (p.note) h += `<div style="background:rgba(255,255,255,0.22);border-radius:10px;padding:6px 11px;color:white;font-weight:700;font-size:11px;margin-bottom:7px">${p.note}</div>`;
  h += `<div class="card"><div class="ct">Kinder-Naehrwerte heute</div>`;
  [{lb:"Kcal",v:pn.kc,aT:1400,tT:1200},{lb:"Vit C",v:pn.vc,aT:70,tT:60},{lb:"Eisen",v:pn.fe,aT:10,tT:8},{lb:"Calcium",v:pn.ca,aT:900,tT:700}].forEach(n => {
    const pa=pct(n.v,n.aT), pt=pct(n.v,n.tT);
    h += `<div style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--t2);margin-bottom:2px"><span>${n.lb}</span><span>Alia ${pa}% Tiana ${pt}%</span></div><div style="display:flex;gap:3px"><div style="flex:1;background:var(--sb);border-radius:4px;height:6px;overflow:hidden"><div style="width:${pa}%;height:100%;background:${bc(pa)};border-radius:4px"></div></div><div style="flex:1;background:var(--sb);border-radius:4px;height:6px;overflow:hidden"><div style="width:${pt}%;height:100%;background:${bc(pt)};border-radius:4px"></div></div></div></div>`;
  });
  h += `</div>`;
  [["f","Fruehstueck"],["m","Mittagessen"],["a","Abendessen"],["s","Snack"]].forEach(([slot,lb]) => {
    const key = W.day+"-"+slot, meal = getMeal(W.day, slot), kat = SLOT_KAT[slot];
    h += `<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px"><div style="flex:1;min-width:0"><div style="color:#764ba2;font-weight:800;font-size:11px;margin-bottom:3px">${lb}</div><div style="font-weight:700;font-size:14px;color:var(--t1);margin-bottom:6px">${meal.n}</div></div><button data-edit-meal="${key}" style="background:var(--hb);color:#764ba2;border:none;border-radius:8px;padding:4px 8px;font-size:10px;font-weight:700;flex-shrink:0;cursor:pointer">${W.mealEdit===key?"Fertig":"Aendern"}</button></div>`;
    if (W.mealEdit===key) {
      const opts = [...(RECIPES[kat]?RECIPES[kat].items:[]), ...(W.customRecipes||[]).filter(r=>r.kat===kat)];
      h += `<select data-meal-select="${key}" class="fi"><option value="">- Standard-Plan -</option>`
        + opts.map(o => `<option value="${o.id}"${meal.rid===o.id?" selected":""}>${o.name} (${o.kc} kcal)</option>`).join("")
        + `<option value="__new__">+ Neues Gericht anlegen</option></select>`;
      if (W.mealNewForm===key) {
        h += `<div style="margin-bottom:6px"><input id="nrn_${key}" class="fi" placeholder="Name (z.B. Doener)">`
          + `<input id="nrkc_${key}" type="number" class="fi" placeholder="Kalorien">`
          + `<input id="nrp_${key}" type="number" class="fi" placeholder="Protein g">`
          + `<input id="nrvc_${key}" type="number" class="fi" placeholder="Vitamin C mg">`
          + `<input id="nrfe_${key}" type="number" class="fi" placeholder="Eisen mg">`
          + `<input id="nrca_${key}" type="number" class="fi" placeholder="Calcium mg">`
          + `<textarea id="nrz_${key}" class="fi" placeholder="Zutaten fuer die Einkaufsliste - eine pro Zeile (leer lassen z.B. bei Essen unterwegs)" style="min-height:60px;resize:vertical"></textarea>`
          + `<button data-save-new-recipe="${key}" class="sb">Rezept speichern</button></div>`;
      }
    }
    h += `<div style="display:flex;gap:4px;flex-wrap:wrap"><span class="tag" style="background:#ff704318;color:#ff7043">${meal.kc} kcal</span><span class="tag" style="background:#4caf5018;color:#4caf50">P:${meal.p}g</span><span class="tag" style="background:#2196f318;color:#2196f3">VitC:${meal.vc}mg</span><span class="tag" style="background:#79554818;color:#795548">Fe:${meal.fe}mg</span><span class="tag" style="background:#00bcd418;color:#00bcd4">Ca:${meal.ca}mg</span></div></div>`;
  });
  document.getElementById("t-plan").innerHTML = h;
}

// STERNE
function awardS(kid, s, n) {
  W.stars[kid]=(W.stars[kid]||0)+s; W.total[kid]=(W.total[kid]||0)+s;
  W.hist.push({kid,n,s,type:"award"}); if(W.hist.length>20)W.hist.shift();
  sv(); rSterne();
}
function redeemR(kid, s, n) {
  if ((W.stars[kid]||0)<s) return;
  W.stars[kid]-=s; W.hist.push({kid,n,s,type:"redeem"}); sv(); rSterne();
}
function confirmReq(id) {
  const r=(W.reqs||[]).find(x=>x.id===id); if(!r)return; r.status="confirmed"; awardS(r.kid,r.s,r.tn);
}
function rejectReq(id) {
  const r=(W.reqs||[]).find(x=>x.id===id); if(r)r.status="rejected"; sv(); rSterne();
}
function saveTask(kid, id) {
  const n=document.getElementById("etn")?.value.trim();
  const s=parseInt(document.getElementById("ets")?.value)||1;
  if(!n)return;
  const t=W.tasks[kid]?.find(x=>x.id===id);
  if(t){t.n=n;t.s=Math.min(10,Math.max(1,s));}
  W.taskEdit=null; sv(); rSterne();
}
function addTask(kid) {
  const n=document.getElementById("ntn")?.value.trim();
  const s=parseInt(document.getElementById("nts")?.value)||1;
  if(!n)return;
  if(!W.tasks[kid])W.tasks[kid]=[];
  W.tasks[kid].push({id:"u"+Date.now(),n,s:Math.min(10,Math.max(1,s))});
  W.taskEdit=null; W.showNT=false; sv(); rSterne();
}

function rSterne() {
  const kid=W.sk, st=W.stars[kid]||0, tot=W.total[kid]||0;
  const tasks=W.tasks[kid]||[];
  let h = `<div style="color:white;font-weight:800;font-size:15px;margin-bottom:7px">Belohnungssystem</div>`;
  // Kid selector
  h += `<div style="display:flex;gap:7px;margin-bottom:8px"><div style="display:flex;background:rgba(255,255,255,0.15);border-radius:11px;padding:3px;gap:2px;flex:1">`;
  [{id:"alia",n:"Alia"},{id:"tiana",n:"Tiana"}].forEach(k => {
    const on=kid===k.id;
    h += `<button data-award="${k.id}" style="flex:1;padding:6px;border-radius:8px;border:none;background:${on?"white":"transparent"};color:${on?"#764ba2":"white"};font-weight:800;font-size:12px;cursor:pointer" onclick="W.sk='${k.id}';sv();rSterne()">${k.n}</button>`;
  });
  h += `</div></div>`;
  // Pending requests
  const pend=(W.reqs||[]).filter(r=>r.kid===kid&&r.status==="pending");
  if (pend.length) {
    h += `<div class="card" style="border-left:4px solid #ff9800"><div class="ct" style="color:#e65100">Anfragen von ${kid==="alia"?"Alia":"Tiana"} (${pend.length})</div>`;
    pend.forEach(r => {
      h += `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd2)"><div style="font-size:12px;font-weight:600">${r.tn} (${r.s} Sterne)</div><div style="display:flex;gap:5px"><button data-confirm-req="${r.id}" style="background:#4caf50;color:white;border:none;border-radius:7px;padding:5px 9px;font-weight:800;font-size:11px;cursor:pointer">OK</button><button data-reject-req="${r.id}" style="background:#ffebee;color:#f44336;border:none;border-radius:7px;padding:5px 9px;font-weight:800;font-size:11px;cursor:pointer">Nein</button></div></div>`;
    });
    h += `</div>`;
  }
  // Stars display
  h += `<div class="card"><div style="text-align:center;padding:8px 0"><div style="font-size:52px;font-weight:900;color:#f57f17;line-height:1">${st}</div><div style="font-size:12px;color:var(--t2);margin-top:2px">Sterne (gesamt: ${tot})</div></div></div>`;
  // Next reward
  const nr=W.rew.filter(r=>r.s>st).sort((a,b)=>a.s-b.s)[0];
  if (nr) {
    const pc=Math.round(st/nr.s*100);
    h += `<div class="card"><div class="ct">Naechste Belohnung: ${nr.n}</div><div class="bw"><div class="bf" style="width:${pc}%;background:linear-gradient(90deg,#f57f17,#ff9800)"></div></div><div style="font-size:11px;color:var(--t2);text-align:center;margin-top:4px">${st} von ${nr.s} Sternen</div></div>`;
  }
  // Tasks
  h += `<div style="color:white;font-weight:800;font-size:14px;margin-bottom:7px">Aufgaben</div>`;
  tasks.forEach(t => {
    if (W.taskEdit===t.id) {
      h += `<div class="card"><div class="ct">Aufgabe bearbeiten</div><input id="etn" value="${t.n}" class="fi" placeholder="Name"><input id="ets" type="number" value="${t.s}" class="fi" placeholder="Sterne" min="1" max="10"><div style="display:flex;gap:6px"><button data-task-save="${t.id}" data-kid="${kid}" class="sb" style="flex:1;margin:0">Speichern</button><button data-task-del="${t.id}" data-task-del="${t.id}" data-kid="${kid}" style="flex:1;background:#ffebee;color:#f44336;border:none;border-radius:9px;padding:9px;font-weight:800;cursor:pointer">Loeschen</button></div></div>`;
    } else {
      h += `<div class="task-row"><div style="flex:1"><div style="font-weight:700;font-size:13px">${t.n}</div><div style="font-size:11px;color:var(--t2)">${t.s} Stern${t.s>1?"e":""}</div></div><button data-award="1" data-kid="${kid}" data-s="${t.s}" data-n="${t.n}" class="award">+${t.s}</button><button data-task-edit="${t.id}" style="background:#ede9ff;color:#764ba2;border:none;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer">Bearb.</button></div>`;
    }
  });
  h += `<div class="card"><button data-toggle-nt="1" style="width:100%;background:var(--hb);color:var(--t2);border:none;border-radius:9px;padding:8px;font-size:11px;font-weight:700;cursor:pointer;text-align:left">+ Eigene Aufgabe</button>`;
  if (W.showNT) {
    h += `<div style="margin-top:8px"><input id="ntn" class="fi" placeholder="Aufgabe (z.B. Buch lesen)"><input id="nts" type="number" class="fi" placeholder="Sterne (1-10)"><button data-add-task="${kid}" class="sb">Hinzufuegen</button></div>`;
  }
  h += `</div>`;
  // Rewards
  h += `<div style="color:white;font-weight:800;font-size:14px;margin-bottom:7px">Belohnungen einloesen</div>`;
  W.rew.forEach(r => {
    const can=st>=r.s;
    h += `<div class="card" style="display:flex;align-items:center;gap:10px"><div style="flex:1"><div style="font-weight:700;font-size:13px">${r.n}</div><div style="font-size:11px;color:var(--t2)">${r.s} Sterne${can?" - verfuegbar!":""}</div></div>`;
    if (can) {
      h += `<button data-redeem="1" data-kid="${kid}" data-s="${r.s}" data-n="${r.n}" style="background:${r.c};color:white;border:none;border-radius:9px;padding:8px 12px;font-size:11px;font-weight:800;cursor:pointer">Einloesen</button>`;
    } else {
      h += `<div style="background:#ddd;color:white;border-radius:9px;padding:8px 12px;font-size:11px;font-weight:800">Warten</div>`;
    }
    h += `</div>`;
  });
  // History
  if (W.hist.length) {
    h += `<div class="card"><div class="ct">Letzte Aktivitaeten</div>`;
    W.hist.slice(-5).reverse().forEach(e => {
      h += `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd2);font-size:12px"><span>${e.kid==="alia"?"Alia":"Tiana"}: ${e.n}</span><span style="color:${e.type==="award"?"#4caf50":"#f44336"};font-weight:700">${e.type==="award"?"+":"-"}${e.s}</span></div>`;
    });
    h += `</div>`;
  }
  document.getElementById("t-sterne").innerHTML = h;
  // Re-attach kid selector onclick (data-award used for both kids and tasks - fix)
  document.querySelectorAll("#t-sterne [data-award]").forEach(b => {
    if (b.dataset.kid && b.dataset.s && b.dataset.n) {
      b.onclick = () => awardS(b.dataset.kid, parseInt(b.dataset.s), b.dataset.n);
    }
  });
}

// SCHULE
function rSchule() {
  const nf=gNF();
  let h = `<div style="color:white;font-weight:800;font-size:15px;margin-bottom:7px">Schule - Alia</div>`;
  if (nf.length) {
    const f=nf[0], du=dU(f.v);
    if (du<=14) h += `<div style="background:${du<=0?"#c8e6c9":"#fff3e0"};border-radius:13px;padding:12px 14px;margin-bottom:8px;border-left:5px solid ${du<=0?"#4caf50":"#ff9800"}"><div style="font-weight:800;font-size:13px;color:${du<=0?"#2e7d32":"#e65100"}">${f.n}${du<=0?" - Schulfrei!":" in "+du+" Tagen!"}</div><div style="font-size:11px;color:#666;margin-top:2px">${fmtD(f.v)} - ${fmtD(f.b)}</div></div>`;
  }
  h += `<div class="card"><div class="ct">Stundenplan</div><div class="sg">`;
  h += `<div class="sc sh">Zeit</div>${SP.t.map(t=>`<div class="sc sh">${t}</div>`).join("")}`;
  SP.z.forEach((z,zi) => {
    h += `<div class="sc sm">${z}</div>`;
    SP.t.forEach((t,ti) => {
      const fa=SP.f[zi]?SP.f[zi][ti]:"";
      h += `<div class="sc sf ${fa?FC[fa]||"fsk":"ff"}">${fa}</div>`;
    });
  });
  h += `</div><div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:3px">`;
  Object.entries(FC).forEach(([f,c]) => {
    h += `<span style="background:${FCC[c]};color:white;border-radius:4px;padding:1px 6px;font-size:9px;font-weight:700">${f}</span>`;
  });
  h += `</div></div>`;
  h += `<div style="color:white;font-weight:800;font-size:14px;margin-bottom:7px">Kommende Ferien</div>`;
  nf.forEach(f => {
    const du=dU(f.v), lauf=du<=0;
    h += `<div class="fc" style="border-left:5px solid ${lauf?"#4caf50":du<=14?"#ff9800":"#764ba2"}"><div style="flex:1"><div style="font-weight:800;font-size:13px">${f.n}</div><div style="font-size:11px;color:var(--t2);margin-top:1px">${fmtD(f.v)} - ${fmtD(f.b)}</div></div><span style="background:${lauf?"#c8e6c9":du<=14?"#ffe0b2":"#ede7f6"};color:${lauf?"#2e7d32":du<=14?"#e65100":"#764ba2"};border-radius:8px;padding:4px 9px;font-size:11px;font-weight:800;white-space:nowrap">${lauf?"Jetzt!":du+"d"}</span></div>`;
  });
  document.getElementById("t-schule").innerHTML = h;
}

// TERMINE
function saveApt() {
  const ti=document.getElementById("nati")?.value.trim(); if(!ti)return;
  const once = document.getElementById("natOnce")?.checked;
  const apt = {id:Date.now(), title:ti, who:document.getElementById("naw")?.value||"Familie", color:"#26a69a"};
  if (once) {
    const dv = document.getElementById("nadate")?.value; if(!dv) return;
    apt.date = dv; apt.day = DAYS[(new Date(dv+"T00:00:00").getDay()+6)%7]; apt.time = document.getElementById("nat2")?.value;
  } else {
    apt.day = document.getElementById("nad")?.value; apt.time = document.getElementById("nat")?.value;
  }
  W.apts.push(apt);
  W.showAF=false; sv(); rTermine();
}
function saveRec(id) {
  const r=W.rec.find(x=>x.id===id); if(!r)return;
  r.day=document.getElementById("red")?.value; r.time=document.getElementById("ret")?.value;
  r.title=document.getElementById("reti")?.value; r.who=document.getElementById("rew2")?.value;
  W.recEdit=null; sv(); rTermine();
}
function rTermine() {
  const d=DAYS[W.day], viewIso=isoDate(viewDate(W.day));
  const dr=W.rec.filter(r=>r.day===d);
  const de=W.apts.filter(a=>a.date ? (a.date===viewIso && a.day===d) : a.day===d);
  let h = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><div style="color:white;font-weight:800;font-size:15px">${DAYSF[W.day]}</div><div style="display:flex;gap:5px"><button data-toggle-af="1" style="background:white;color:#764ba2;border:none;border-radius:9px;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer">+ Termin</button><button onclick="window.print()" style="background:rgba(255,255,255,0.2);color:white;border:none;border-radius:9px;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer">Drucken</button></div></div>`;
  if (W.showAF) {
    h += `<div class="card"><div class="ct">Neuer Termin</div>`
      + `<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px"><input type="checkbox" id="natOnce" data-toggle-once="1"><label for="natOnce" style="font-size:11px;color:var(--t2)">Einmalig an festem Datum (statt jede Woche)</label></div>`
      + `<div id="nadWrap" style="display:flex;gap:6px;margin-bottom:6px"><select id="nad" style="flex:1;padding:7px;border-radius:8px;border:2px solid var(--bd);background:var(--ib);color:var(--t1);font-size:12px">${DAYS.map(x=>`<option${x===d?" selected":""}>${x}</option>`).join("")}</select><input id="nat" style="flex:1;padding:7px;border-radius:8px;border:2px solid var(--bd);background:var(--ib);color:var(--t1);font-size:12px" placeholder="Zeit"></div>`
      + `<div id="nadateWrap" style="display:none;gap:6px;margin-bottom:6px"><input type="date" id="nadate" class="fi" style="margin-bottom:0;flex:1" value="${viewIso}"><input id="nat2" style="flex:1;padding:7px;border-radius:8px;border:2px solid var(--bd);background:var(--ib);color:var(--t1);font-size:12px" placeholder="Zeit"></div>`
      + `<input id="nati" class="fi" placeholder="Termin"><input id="naw" class="fi" placeholder="Wer?"><button data-save-apt="1" class="sb">Speichern</button></div>`;
  }
  if (dr.length) {
    h += `<div style="color:rgba(255,255,255,0.7);font-size:10px;font-weight:700;margin-bottom:5px;letter-spacing:1px">JEDE WOCHE (tippen = bearbeiten)</div>`;
    dr.forEach(r => {
      if (W.recEdit===r.id) {
        h += `<div class="card"><div class="ct">Bearbeiten</div><div style="display:flex;gap:6px;margin-bottom:6px"><select id="red" style="flex:1;padding:7px;border-radius:8px;border:2px solid var(--bd);background:var(--ib);color:var(--t1);font-size:12px">${DAYS.map(x=>`<option${x===r.day?" selected":""}>${x}</option>`).join("")}</select><input id="ret" value="${r.time}" style="flex:1;padding:7px;border-radius:8px;border:2px solid var(--bd);background:var(--ib);color:var(--t1);font-size:12px"></div><input id="reti" value="${r.title}" class="fi"><input id="rew2" value="${r.who}" class="fi"><div style="display:flex;gap:6px"><button data-rec-save="${r.id}" class="sb" style="flex:1;margin:0">Speichern</button><button data-rec-del="${r.id}" style="flex:1;background:#ffebee;color:#f44336;border:none;border-radius:9px;padding:9px;font-weight:800;cursor:pointer">Loeschen</button></div></div>`;
      } else {
        h += `<div data-rec-edit="${r.id}" style="background:var(--cb);color:var(--t1);border-radius:13px;padding:10px 13px;margin-bottom:6px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 12px rgba(0,0,0,0.1);border-left:5px solid ${r.color};cursor:pointer"><div style="flex:1"><div style="font-weight:800;font-size:13px">${r.title}</div><div style="font-size:11px;color:var(--t2)">${r.time} - ${r.who}</div></div><span style="font-size:10px;color:var(--t4)">&#9998;</span></div>`;
      }
    });
  }
  if (de.length) {
    h += `<div style="color:rgba(255,255,255,0.7);font-size:10px;font-weight:700;margin-bottom:5px;margin-top:8px;letter-spacing:1px">EINMALIG</div>`;
    de.forEach(a => {
      h += `<div style="background:var(--cb);color:var(--t1);border-radius:13px;padding:10px 13px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 3px 12px rgba(0,0,0,0.1);border-left:5px solid ${a.color}"><div><div style="font-weight:800;font-size:13px">${a.title}</div><div style="font-size:11px;color:var(--t2)">${a.time?" "+a.time+" - ":""}${a.who}</div></div><button data-apt-del="${a.id}" class="dlb">x</button></div>`;
    });
  }
  if (!dr.length&&!de.length) h += `<div class="eb">Keine Termine heute</div>`;
  h += `<div style="color:white;font-weight:800;font-size:14px;margin-top:14px;margin-bottom:7px">Ganze Woche</div><div class="card">`;
  DAYS.forEach((dd,di) => {
    const dtI = isoDate(viewDate(di));
    const all=[...W.rec.filter(r=>r.day===dd),...W.apts.filter(a=>a.date?(a.date===dtI&&a.day===dd):a.day===dd)];
    h += `<div class="wr"><div style="width:24px;font-weight:900;font-size:11px;color:#764ba2;padding-top:2px;flex-shrink:0">${dd}</div><div class="wt">`;
    if (all.length) all.forEach(a => { h += `<span class="wtg" style="background:${(a.color||"#764ba2")}15;color:${a.color||"#764ba2"}">${a.title}</span>`; });
    else h += `<span style="font-size:10px;color:var(--t4)">frei</span>`;
    h += `</div></div>`;
  });
  h += `</div>`;
  document.getElementById("t-termine").innerHTML = h;
}

// EINKAUF
function rEinkauf() {
  let h = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><div style="color:white;font-weight:800;font-size:15px">Einkaufsliste</div><div style="display:flex;gap:5px"><button data-share-einkauf="1" style="background:white;color:#764ba2;border:none;border-radius:9px;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer">Teilen</button><button onclick="window.print()" style="background:rgba(255,255,255,0.2);color:white;border:none;border-radius:9px;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer">Drucken</button></div></div>`;
  h += `<div style="background:rgba(255,255,255,0.18);border-radius:10px;padding:6px 11px;color:white;font-size:11px;margin-bottom:7px">Aliana Kernkraft Leinoel nicht vergessen!</div>`;
  const wpItems = getPlanIngredients();
  if (wpItems.length) {
    const dnWp = wpItems.filter(x=>W.chk["wp-"+x]).length;
    h += `<div class="card" style="${dnWp===wpItems.length?"opacity:.7":""}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><div class="ct" style="margin:0">Aus dem Wochenplan</div><span style="font-size:10px;font-weight:700;color:${dnWp===wpItems.length?"#4caf50":"#aaa"}">${dnWp===wpItems.length?"Fertig":dnWp+"/"+wpItems.length}</span></div>`;
    wpItems.forEach(x => {
      const k="wp-"+x, c=W.chk[k];
      h += `<div class="si" data-chk="${k}"><div class="chkbox${c?" on":""}">${c?"v":""}</div><span style="font-size:12px;color:${c?"var(--t3)":"var(--t1)"};text-decoration:${c?"line-through":"none"}">${x}</span></div>`;
    });
    h += `</div>`;
  }
  SHOP.forEach((cat,ci) => {
    const dn=cat.i.filter((x,ii)=>W.chk[ci+"-"+ii]).length;
    h += `<div class="card" style="${dn===cat.i.length?"opacity:.7":""}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><div class="ct" style="margin:0">${cat.c}</div><span style="font-size:10px;font-weight:700;color:${dn===cat.i.length?"#4caf50":"#aaa"}">${dn===cat.i.length?"Fertig":dn+"/"+cat.i.length}</span></div>`;
    cat.i.forEach((x,ii) => {
      const k=`${ci}-${ii}`, c=W.chk[k];
      h += `<div class="si" data-chk="${k}"><div class="chkbox${c?" on":""}">${c?"v":""}</div><span style="font-size:12px;color:${c?"var(--t3)":"var(--t1)"};text-decoration:${c?"line-through":"none"}">${x}</span></div>`;
    });
    h += `</div>`;
  });
  h += `<div class="card"><div class="ct">Daten sichern</div><div style="font-size:11px;color:var(--t2);margin-bottom:8px">Alle Daten (Termine, Sterne, Aufgaben, Haken) als Datei sichern oder auf einem neuen Geraet wiederherstellen.</div><button data-export-backup="1" class="sb">Backup herunterladen</button><label style="display:block;text-align:center;margin-top:6px;cursor:pointer;background:var(--hb);color:var(--t2);border-radius:9px;padding:7px 12px;font-size:11px;font-weight:700">Backup wiederherstellen<input type="file" id="backupFile" accept="application/json" style="display:none"></label></div>`;
  document.getElementById("t-einkauf").innerHTML = h;
  const bf = document.getElementById("backupFile");
  if (bf) bf.onchange = () => importBackup(bf.files[0]);
}

// SPORT
function saveSched() {
  const ti=document.getElementById("nsti")?.value.trim(); if(!ti)return;
  W.sched.push({id:"u"+Date.now(),day:document.getElementById("nsd")?.value,type:document.getElementById("nst")?.value,title:ti,who:document.getElementById("nstw")?.value||"Familie"});
  W.showSF=false; sv(); rSport();
}
function rSport() {
  const d=DAYS[W.day], its=W.sched.filter(s=>s.day===d);
  let h = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><div style="color:white;font-weight:800;font-size:15px">Bewegung - ${d}</div><button data-toggle-sf="1" style="background:white;color:#764ba2;border:none;border-radius:9px;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer">+ Aktivitaet</button></div>`;
  if (W.showSF) {
    h += `<div class="card"><div class="ct">Neue Aktivitaet</div><div style="display:flex;gap:6px;margin-bottom:6px"><select id="nsd" style="flex:1;padding:7px;border-radius:8px;border:2px solid var(--bd);background:var(--ib);color:var(--t1);font-size:12px">${DAYS.map(x=>`<option${x===d?" selected":""}>${x}</option>`).join("")}</select><select id="nst" style="flex:1;padding:7px;border-radius:8px;border:2px solid var(--bd);background:var(--ib);color:var(--t1);font-size:12px"><option value="training">Training</option><option value="lernen">Lernen</option><option value="ruhe">Ruhe</option></select></div><input id="nsti" class="fi" placeholder="Titel (z.B. Fussball, Wandern)"><input id="nstw" class="fi" placeholder="Wer?"><button data-save-sched="1" class="sb">Speichern</button></div>`;
  }
  if (!its.length) h += `<div class="eb">Freier Tag</div>`;
  its.forEach(s => {
    const c=TC[s.type];
    h += `<div class="spk" style="background:${c.bg};border-color:${c.bd}"><div style="display:flex;align-items:center;gap:7px"><div style="flex:1"><div style="font-weight:800;font-size:13px;color:${c.tx}">${s.title}</div><div style="font-size:10px;color:${c.tx};opacity:.7">${s.who}</div></div><span style="background:${c.bd}30;color:${c.tx};border-radius:6px;padding:2px 6px;font-size:9px;font-weight:700">${c.lb}</span><button data-sched-del="${s.id}" class="dlb">x</button></div></div>`;
  });
  h += `<div style="color:white;font-weight:800;font-size:14px;margin-top:12px;margin-bottom:7px">Wochenplan</div><div class="card">`;
  DAYS.forEach(dd => {
    const i2=W.sched.filter(s=>s.day===dd);
    h += `<div class="wr"><div style="width:24px;font-weight:900;font-size:11px;color:#764ba2;padding-top:2px;flex-shrink:0">${dd}</div><div class="wt">`;
    if (i2.length) i2.forEach(s => { const c=TC[s.type]; h += `<span class="wtg" style="background:${c.bg};color:${c.tx}">${s.title}</span>`; });
    else h += `<span style="font-size:10px;color:var(--t4)">Frei</span>`;
    h += `</div></div>`;
  });
  h += `</div>`;
  document.getElementById("t-sport").innerHTML = h;
}

// INIT
ld();
migrateMealOv();
showScr("start");
</script>
