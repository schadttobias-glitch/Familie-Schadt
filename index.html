<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Familie Schadt</title>
<style>
:root{--cb:#fff;--cb2:#f8f8ff;--ib:#fff;--hb:#f5f5f5;--sb:#f0f0f0;--t1:#222;--t2:#666;--t3:#999;--t4:#ccc;--bd:#eee;--bd2:#f5f5f5;--dg:#ffebee}
body.dark{--cb:#1e1e2e;--cb2:#242438;--ib:#242438;--hb:#2a2a3e;--sb:#2a2a3e;--t1:#e8e8f0;--t2:#a8a8bc;--t3:#8888a0;--t4:#5a5a72;--bd:#33334a;--bd2:#2c2c42;--dg:#3a1f28}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
@media (min-width:768px){
  #app-content,#kids-content{max-width:760px}
}
@media (min-width:768px) and (max-width:1023px){
  #app-content,#kids-content,#start-inner,#pin-inner,#lock-inner{zoom:1.15}
}
@media (min-width:1024px){
  #app-content,#start-inner,#pin-inner,#lock-inner{zoom:1.3}
  #kids-content{zoom:1.2}
  #scr-app.active{
    display:grid;
    grid-template-columns:230px 1fr;
    grid-template-areas:"nav header" "nav days" "nav week" "nav content";
    align-content:start;
  }
  #app-header{grid-area:header}
  #day-row{grid-area:days}
  #week-row{grid-area:week}
  #tab-row{grid-area:nav;flex-direction:column;align-items:stretch;margin:16px;border-radius:16px;padding:10px;gap:6px;height:fit-content;position:sticky;top:16px;overflow:visible}
  #tab-row .tb{flex-direction:row;justify-content:flex-start;gap:10px;padding:12px 14px;font-size:14px}
  #tab-row .tb span{font-size:18px}
  #app-content{grid-area:content;padding:0 24px 24px}
}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
.card{background:var(--cb);color:var(--t1);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
.ct{color:#764ba2;font-weight:800;font-size:12px;margin-bottom:8px}
.tag{border-radius:7px;padding:2px 7px;font-size:10px;font-weight:700}
.bw{background:var(--sb);border-radius:6px;height:8px;overflow:hidden}
.bf{height:100%;border-radius:6px}
.sb{width:100%;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;border-radius:9px;padding:9px;font-weight:800;font-size:13px;margin-top:5px;cursor:pointer}
.fi{width:100%;padding:7px 10px;border-radius:8px;border:2px solid var(--bd);background:var(--ib);color:var(--t1);font-size:12px;margin-bottom:5px}
.dlb{background:var(--dg);color:#f44336;border:none;border-radius:6px;width:28px;height:28px;font-size:13px;font-weight:800;cursor:pointer}
.tb{flex:0 0 auto;padding:6px 8px;border-radius:9px;border:none;background:transparent;color:white;font-weight:700;font-size:9.5px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.tb span{font-size:13px}
.tb.on{background:white;color:#764ba2}
.si{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd2);align-items:center;cursor:pointer}
.chkbox{min-width:19px;height:19px;border-radius:5px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:white}
.chkbox.on{background:#764ba2;border-color:#764ba2}
.wr{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start}
.wt{display:flex;flex-wrap:wrap;gap:3px}
.wtg{border-radius:6px;padding:1px 6px;font-size:10px;font-weight:600}
.confetti-piece{position:fixed;width:8px;height:14px;top:-20px;z-index:9999;pointer-events:none;animation:confetti-fall 1.4s ease-in forwards}
@keyframes confetti-fall{to{transform:translateY(105vh) rotate(540deg);opacity:0.3}}
.spk{border-radius:13px;padding:11px 13px;margin-bottom:7px;border-left:5px solid}
.sg{display:grid;grid-template-columns:38px repeat(5,1fr);gap:2px;font-size:9px}
.sc{border-radius:4px;padding:3px 2px;text-align:center;font-weight:600;min-height:30px;display:flex;align-items:center;justify-content:center;line-height:1.2}
.sh{background:#764ba2;color:white;font-weight:800}
.sm{background:var(--cb2);color:#764ba2;font-weight:700;font-size:8px}
.sf{color:white;font-weight:700}
.ff{background:transparent!important;color:var(--t4)!important}
.fd{background:#2e7d32}.fm{background:#1565c0}.fe2{background:#6a1b9a}
.fsk{background:#e65100}.fk{background:#ad1457}.fsp{background:#00695c}
.fmu{background:#4527a0}.fr{background:#37474f}.fw{background:#5d4037}
.fc{border-radius:13px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;background:var(--cb);color:var(--t1);box-shadow:0 3px 12px rgba(0,0,0,0.08)}
.pin-btn{width:70px;height:70px;border-radius:50%;background:white;border:3px solid #e0e0e0;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,0.1)}
.ktask{background:white;border-radius:18px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.doneBtn{color:white;border:none;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:900;cursor:pointer;flex-shrink:0}
.task-row{background:var(--cb);color:var(--t1);border-radius:13px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 12px rgba(0,0,0,0.08)}
.award{background:linear-gradient(135deg,#f57f17,#ff9800);color:white;border:none;border-radius:9px;padding:7px 11px;font-size:11px;font-weight:800;flex-shrink:0;cursor:pointer}
.profbtn{border:none;border-radius:20px;padding:18px 12px;font-weight:900;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,0.25);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex:1}
.screen{display:none;min-height:100vh}
.screen.active{display:block}
#scr-start.active,#scr-pin.active,#scr-lock.active{display:flex}
.eb{background:rgba(255,255,255,0.15);border-radius:13px;padding:16px;color:white;text-align:center;font-size:12px}
@media print{
  #day-row,#tab-row,button,input[type=file]{display:none!important}
  body{background:white;padding-bottom:0}
  .card,.fc,.task-row{background:white!important;color:#222!important;box-shadow:none!important;border:1px solid #ddd}
  #scr-app{padding-bottom:0}
}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="scr-lock" class="screen" style="background:linear-gradient(135deg,#667eea,#764ba2);flex-direction:column;align-items:center;justify-content:center;padding:24px">
  <div id="lock-inner" style="display:flex;flex-direction:column;align-items:center">
    <div style="font-size:40px;margin-bottom:10px">&#128274;</div>
    <div style="color:white;font-size:20px;font-weight:900;margin-bottom:4px">Familie Schadt</div>
    <div style="color:rgba(255,255,255,0.8);font-size:13px;margin-bottom:20px">Nur fuer die Familie - Zugangscode eingeben</div>
    <div id="lock-dots" style="display:flex;gap:10px;margin-bottom:20px"></div>
    <div id="lock-grid" style="display:grid;grid-template-columns:repeat(3,70px);gap:10px;margin-bottom:12px"></div>
    <div id="lock-err" style="color:#ff6b6b;font-size:13px;font-weight:700;height:20px;margin-bottom:8px"></div>
  </div>
</div>

<!-- START SCREEN -->
<div id="scr-start" class="screen" style="background:linear-gradient(135deg,#667eea,#764ba2);flex-direction:column;align-items:center;justify-content:center;padding:24px">

  <div id="fam-name-start" style="color:white;font-size:24px;font-weight:900;margin-bottom:4px">Familie Schadt</div>

  <div style="display:flex;gap:10px;width:100%;max-width:320px;margin-bottom:12px">
    <button class="profbtn" style="background:linear-gradient(135deg,#1565c0,#42a5f5);color:white" data-goto-eltern="1">
      <span id="avatar-tobi" style="font-size:36px">&#129492;</span><span id="parent-name-tobi">Tobi</span>
    </button>
    <button class="profbtn" style="background:linear-gradient(135deg,#ad1457,#f06292);color:white" data-goto-eltern="1">
      <span id="avatar-eva" style="font-size:36px">&#128105;</span><span id="parent-name-eva">Eva</span>

  </div>
  <div style="display:flex;gap:10px;width:100%;max-width:320px">
    <button class="profbtn" style="background:linear-gradient(135deg,#ff6b6b,#feca57);color:#333" data-goto-kind="alia">
      <span id="avatar-alia" style="font-size:36px">&#128103;</span><span id="kid-name-alia">Alia</span>

    <button class="profbtn" style="background:linear-gradient(135deg,#48dbfb,#ff9ff3);color:#333" data-goto-kind="tiana">
      <span id="avatar-tiana" style="font-size:36px">&#129306;</span><span id="kid-name-tiana">Tiana</span>
    </button>
  </div>
  </div>
</div>

<!-- PIN SCREEN -->
<div id="scr-pin" class="screen" style="background:linear-gradient(135deg,#667eea,#764ba2);flex-direction:column;align-items:center;justify-content:center;padding:24px">
  <div id="pin-inner" style="display:flex;flex-direction:column;align-items:center">
  <div style="font-size:36px;margin-bottom:10px">&#128274;</div>
  <div style="color:white;font-size:20px;font-weight:900;margin-bottom:4px">Eltern-Bereich</div>
  <div style="color:rgba(255,255,255,0.8);font-size:13px;margin-bottom:20px">PIN eingeben</div>

  <div id="pin-err" style="color:#ff6b6b;font-size:13px;font-weight:700;height:20px;margin-bottom:8px"></div>
  <button data-goto-start="1" style="color:rgba(255,255,255,0.7);background:none;border:none;font-size:13px;cursor:pointer">Abbrechen</button>
  </div>
</div>

<!-- KIDS SCREEN -->
<div id="scr-kids" class="screen">
  <div id="kids-content"></div>
  <div style="position:fixed;bottom:0;left:0;right:0;padding:10px 14px;background:rgba(255,255,255,0.97);display:flex;gap:8px;box-shadow:0 -3px 15px rgba(0,0,0,0.1)">
    <button id="ktb-s" data-ktab="s" style="flex:1;padding:10px;border-radius:11px;border:none;background:linear-gradient(135deg,#f57f17,#ff9800);color:white;font-weight:800;font-size:12px;cursor:pointer">&#11088; Sterne</button>
    <button id="ktb-a" data-ktab="a" style="flex:1;padding:10px;border-radius:11px;border:2px solid #eee;background:white;color:#555;font-weight:800;font-size:12px;cursor:pointer">&#9989; Aufgaben</button>
    <button id="ktb-e" data-ktab="e" style="flex:1;padding:10px;border-radius:11px;border:2px solid #eee;background:white;color:#555;font-weight:800;font-size:12px;cursor:pointer">&#127869; Essen</button>
    <button data-goto-start="1" style="padding:10px 13px;border-radius:11px;border:2px solid #eee;background:white;color:#555;font-weight:800;font-size:12px;cursor:pointer">&#8592;</button>
  </div>
</div>

<!-- APP SCREEN -->

      <div style="font-size:17px;font-weight:900">&#127807; <span id="fam-name-app">Familie Schadt</span></div>

    <div style="display:flex;gap:8px;align-items:center">

  </div>

</div>

function getPlanIngredients() {
  const seen = new Set(), out = [];
  for (let di=0; di<7; di++) {
    ["f","m","a","s"].forEach(slot => {
      const meal = getMeal(di, slot);
      const r = meal.rid ? findRecipe(meal.rid) : null;
      if (r && r.zutaten && r.zutaten.length) {
        const factor = (meal.portions || r.basePortions || 4) / (r.basePortions || 4);
        r.zutaten.forEach(z => { const scaled=scaleIngredient(z,factor); const k=scaled.trim().toLowerCase(); if(!seen.has(k)){seen.add(k);out.push(scaled);} });
      }
    });
  }
  return out;
}

  if (!confirm("Ersetzt die Rezeptauswahl fuer die gesamte angezeigte Woche mit einem zufaelligen, abwechslungsreichen Plan. Unbeliebte Gerichte (mehr Daumen runter als hoch) werden vermieden. Fortfahren?")) return;

  });

function compressImageFile(file, maxSize) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const side = Math.min(img.width, img.height);
        const sx = (img.width-side)/2, sy = (img.height-side)/2;
        const canvas = document.createElement("canvas");
        canvas.width = maxSize; canvas.height = maxSize;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, sx, sy, side, side, 0, 0, maxSize, maxSize);
        resolve(canvas.toDataURL("image/jpeg", 0.75));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

const ICS_DAY = {Mo:"MO",Di:"TU",Mi:"WE",Do:"TH",Fr:"FR",Sa:"SA",So:"SU"};
function nextDateForWeekday(dayStr, timeStr) {
  const targetIdx = DAYS.indexOf(dayStr);
  const now = new Date();
  const curIdx = (now.getDay()+6)%7;
  const diff = (targetIdx - curIdx + 7) % 7;
  const d = new Date(now);
  d.setDate(d.getDate()+diff);
  if (timeStr) { const [h,m] = timeStr.split(":").map(Number); d.setHours(h||0, m||0, 0, 0); }
  else d.setHours(9,0,0,0);
  return d;
}
function icsDate(d) {
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"T"+p(d.getHours())+p(d.getMinutes())+"00";
}
function icsStamp(d) {
  const p = n => String(n).padStart(2,"0");
  return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+"T"+p(d.getUTCHours())+p(d.getUTCMinutes())+p(d.getUTCSeconds())+"Z";
}
function icsEscape(s) { return String(s).replace(/[\\;,]/g, m => "\\"+m).replace(/\n/g,"\\n"); }
function freqRule(item) {
  if (item.freq === "monthly") return "FREQ=MONTHLY;BYMONTHDAY="+(item.dayOfMonth||1);
  if (item.freq === "biweekly") return "FREQ=WEEKLY;INTERVAL=2;BYDAY="+ICS_DAY[item.day];
  return "FREQ=WEEKLY;BYDAY="+ICS_DAY[item.day];
}
function nextOccurrence(item) {
  if (item.freq === "monthly") {
    const now = new Date(); const dom = item.dayOfMonth||1;
    let d = new Date(now.getFullYear(), now.getMonth(), dom);
    if (d < now) d = new Date(now.getFullYear(), now.getMonth()+1, dom);
    if (item.time) { const [h,m] = item.time.split(":").map(Number); d.setHours(h||0, m||0, 0, 0); } else d.setHours(9,0,0,0);
    return d;
  }
  let d = nextDateForWeekday(item.day, item.time);
  if (item.freq === "biweekly") { let guard=0; while (!recOccursOn(item, d) && guard<14) { d.setDate(d.getDate()+7); guard++; } }
  return d;
}
function exportICS() {
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Familie Schadt//App//DE","CALSCALE:GREGORIAN"];
  const stamp = icsStamp(new Date());
  let uidN = 0;
  const addEvent = (title, dt, who, rrule) => {
    uidN++;
    lines.push("BEGIN:VEVENT");
    lines.push("UID:fs-"+Date.now()+"-"+uidN+"@familie-schadt");
    lines.push("DTSTAMP:"+stamp);
    lines.push("DTSTART:"+icsDate(dt));
    lines.push("SUMMARY:"+icsEscape(title));
    if (who) lines.push("DESCRIPTION:"+icsEscape(who));
    if (rrule) lines.push("RRULE:"+rrule);
    lines.push("END:VEVENT");
  };
  W.rec.forEach(r => addEvent(r.title, nextOccurrence(r), r.who, freqRule(r)));
  W.apts.forEach(a => {
    if (a.date) {
      const [y,m,d] = a.date.split("-").map(Number);
      const dt = new Date(y, m-1, d);
      if (a.time) { const [h,mi] = a.time.split(":").map(Number); dt.setHours(h||0, mi||0); } else dt.setHours(9,0);
      addEvent(a.title, dt, a.who, null);
    } else {
      addEvent(a.title, nextOccurrence(a), a.who, freqRule(a));
    }
  });
  lines.push("END:VCALENDAR");
  const blob = new Blob([lines.join("\r\n")], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "familie-schadt-termine.ics";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// APP LOCK (Zugriffsschutz fuer die ganze App - nur fuer die Familie, nicht oeffentlich)
const APP_LOCK_CODE = "573192";
let lockBuf = "";
function renderLockUI() {
  const dots = document.getElementById("lock-dots");
  const grid = document.getElementById("lock-grid");
  if (!dots || !grid) return;
  dots.innerHTML = Array.from({length:6}, (_,i) =>
    `<div style="width:14px;height:14px;border-radius:50%;background:${i<lockBuf.length?"white":"rgba(255,255,255,0.3)"};border:2px solid white"></div>`
  ).join("");
  grid.innerHTML = ["1","2","3","4","5","6","7","8","9","","0","X"].map(b =>
    b ? `<button class="pin-btn" data-lock="${b}">${b==="X"?"&#9003;":b}</button>` : `<div></div>`
  ).join("");
}
function lockKey(k) {
  if (k==="X") { lockBuf=lockBuf.slice(0,-1); renderLockUI(); return; }
  lockBuf += k;
  renderLockUI();
  if (lockBuf.length >= 6) {
    if (lockBuf === APP_LOCK_CODE) {
      try { localStorage.setItem("fs11-unlocked","1"); } catch(e) {}
      showScr("start");
    } else {
      const e = document.getElementById("lock-err");
      if (e) e.textContent = "Falscher Code!";
      setTimeout(() => { lockBuf=""; renderLockUI(); if(e) e.textContent=""; }, 1000);
    }
  }
}
function isUnlocked() {
  try { return localStorage.getItem("fs11-unlocked") === "1"; } catch(e) { return false; }
}

  }

  const nutRowPair = (a, b) => [{lb:"Kcal",v:pn.kc,f:"kcal"},{lb:"Vit C",v:pn.vc,f:"vitC"},{lb:"Eisen",v:pn.fe,f:"iron"},{lb:"Calcium",v:pn.ca,f:"calcium"}].map(n => {

    + nutRowPair(W.parents[0], W.parents[1])
    + `</div>`;
  h += rAuswertung();
  [["f","Fruehstueck"],["m","Mittagessen"],["a","Abendessen"],["s","Snack"]].forEach(([slot,lb]) => {

    if (W.mealEdit===key) {
      const opts = [...(RECIPES[kat]?RECIPES[kat].items:[]), ...(W.customRecipes||[]).filter(r=>r.kat===kat)];
      h += `<select data-meal-select="${key}" class="fi"><option value="">- Standard-Plan -</option>`
        + opts.map(o => `<option value="${o.id}"${meal.rid===o.id?" selected":""}>${o.name} (${o.kc} kcal)</option>`).join("")
        + `<option value="__new__">+ Neues Gericht anlegen</option></select>`;
      if (W.mealNewForm===key) {
        h += `<div style="margin-bottom:6px"><input id="nrn_${key}" class="fi" placeholder="Name (z.B. Doener)">`
          + `<input id="nrkc_${key}" type="number" class="fi" placeholder="Kalorien">`
          + `<input id="nrp_${key}" type="number" class="fi" placeholder="Protein g">`
          + `<input id="nrvc_${key}" type="number" class="fi" placeholder="Vitamin C mg">`
          + `<input id="nrfe_${key}" type="number" class="fi" placeholder="Eisen mg">`
          + `<input id="nrca_${key}" type="number" class="fi" placeholder="Calcium mg">`
          + `<textarea id="nrz_${key}" class="fi" placeholder="Zutaten fuer die Einkaufsliste - eine pro Zeile (leer lassen z.B. bei Essen unterwegs)" style="min-height:60px;resize:vertical"></textarea>`
          + `<textarea id="nrzb_${key}" class="fi" placeholder="Zubereitung - ein Schritt pro Zeile (optional)" style="min-height:60px;resize:vertical"></textarea>`
          + `<input id="nrport_${key}" type="number" class="fi" value="4" placeholder="Zutaten reichen fuer wie viele Portionen?">`
          + `<button data-save-new-recipe="${key}" class="sb">Rezept speichern</button></div>`;
      }
    }
    h += `<div style="display:flex;gap:4px;flex-wrap:wrap"><span class="tag" style="background:#ff704318;color:#ff7043">${meal.kc} kcal</span><span class="tag" style="background:#4caf5018;color:#4caf50">P:${meal.p}g</span><span class="tag" style="background:#2196f318;color:#2196f3">VitC:${meal.vc}mg</span><span class="tag" style="background:#79554818;color:#795548">Fe:${meal.fe}mg</span><span class="tag" style="background:#00bcd418;color:#00bcd4">Ca:${meal.ca}mg</span></div>`;
    if (meal.rid) {
      h += ratingBadgesHtml(meal.rid);
    }
    const rcp = meal.rid ? findRecipe(meal.rid) : null;
    if (rcp && rcp.zutaten && rcp.zutaten.length) {
      const factor = meal.portions / (rcp.basePortions||4);
      h += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--bd2)">`
        + `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="font-size:10px;font-weight:700;color:var(--t2)">Zutaten fuer</span>`
        + `<span style="display:flex;align-items:center;gap:6px"><button data-portion="${key}" data-delta="-1" style="width:22px;height:22px;border-radius:6px;border:none;background:var(--hb);color:#764ba2;font-weight:800;cursor:pointer">-</button><b style="font-size:12px;color:var(--t1)">${meal.portions} Portionen</b><button data-portion="${key}" data-delta="1" style="width:22px;height:22px;border-radius:6px;border:none;background:var(--hb);color:#764ba2;font-weight:800;cursor:pointer">+</button></span></div>`
        + rcp.zutaten.map(z => `<div style="font-size:11px;color:var(--t2);padding:2px 0">- ${scaleIngredient(z,factor)}</div>`).join("")
        + `</div>`;
      if (rcp.zubereitung && rcp.zubereitung.length) {
        h += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--bd2)">`
          + `<div style="font-size:10px;font-weight:700;color:var(--t2);margin-bottom:4px">Zubereitung</div>`
          + `<ol style="margin:0;padding-left:16px">`
          + rcp.zubereitung.map(step => `<li style="font-size:11px;color:var(--t2);padding:2px 0">${esc(step)}</li>`).join("")
          + `</ol></div>`;
      }
    }
    h += `</div>`;
  });
  document.getElementById("t-plan").innerHTML = h;
}

let lastSeenKidStars = {};
function showConfetti() {
  const colors = ["#f44336","#ff9800","#ffeb3b","#4caf50","#2196f3","#9c27b0","#e91e63"];
  for (let i=0;i<36;i++) {
    const el = document.createElement("div");
    el.className = "confetti-piece";
    el.style.left = (Math.random()*100)+"vw";
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDelay = (Math.random()*0.3)+"s";
    el.style.animationDuration = (1+Math.random()*0.9)+"s";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2300);
  }
}
const MASCOT_TIERS = [
  {min:0, emoji:"&#128037;", name:"Kleines Kueken"},
  {min:20, emoji:"&#128037;&#127775;", name:"Freches Kueken"},
  {min:50, emoji:"&#129418;", name:"Schlauer Fuchs"},
  {min:100, emoji:"&#129409;", name:"Starker Loewe"},
  {min:200, emoji:"&#128009;", name:"Drachen-Meister"},
];
function mascotForStars(total) {
  let cur = MASCOT_TIERS[0];
  for (const t of MASCOT_TIERS) if (total>=t.min) cur = t;
  const next = MASCOT_TIERS.find(t => t.min > total);
  return {cur, next};
}
function hasHistStreak(kid, days) {
  const dates = new Set((W.hist||[]).filter(e=>e.kid===kid&&e.type==="award").map(e=>e.date));
  let count=0, d=new Date(); d.setHours(0,0,0,0);
  for (let i=0;i<days;i++) {
    if (dates.has(isoDate(d))) count++; else break;
    d.setDate(d.getDate()-1);
  }
  return count>=days;
}
const BADGES = [
  {id:"first", name:"Erster Stern", emoji:"&#127775;", check: kid => (W.hist||[]).some(e=>e.kid===kid&&e.type==="award")},
  {id:"ten", name:"Fleissig", emoji:"&#127941;", check: kid => (W.hist||[]).filter(e=>e.kid===kid&&e.type==="award").length>=10},
  {id:"fifty", name:"Superfleissig", emoji:"&#127942;", check: kid => (W.hist||[]).filter(e=>e.kid===kid&&e.type==="award").length>=50},
  {id:"streak7", name:"7-Tage-Serie", emoji:"&#128293;", check: kid => hasHistStreak(kid,7)},
  {id:"stars50", name:"Stern-Sammler", emoji:"&#10024;", check: kid => (W.total[kid]||0)>=50},
  {id:"stars100", name:"Stern-Profi", emoji:"&#128081;", check: kid => (W.total[kid]||0)>=100},
  {id:"redeem1", name:"Erste Belohnung", emoji:"&#127873;", check: kid => (W.hist||[]).some(e=>e.kid===kid&&e.type==="redeem")},
];
function awardS(kid, s, n) {
  W.stars[kid]=(W.stars[kid]||0)+s; W.total[kid]=(W.total[kid]||0)+s;
  W.hist.push({id:Date.now(), kid,n,s,type:"award",date:isoDate(new Date())}); if(W.hist.length>200)W.hist.shift();
  sv(); rSterne();
}
function redeemR(kid, s, n) {
  if ((W.stars[kid]||0)<s) return;
  W.stars[kid]-=s; W.hist.push({id:Date.now(), kid,n,s,type:"redeem",date:isoDate(new Date())}); if(W.hist.length>200)W.hist.shift();
  sv(); rSterne();
}
function deleteHistEntry(id) {
  const e = (W.hist||[]).find(x => String(x.id)===String(id));
  if (!e) return;
  if (e.type==="award") { W.stars[e.kid]=(W.stars[e.kid]||0)-e.s; W.total[e.kid]=(W.total[e.kid]||0)-e.s; }
  else { W.stars[e.kid]=(W.stars[e.kid]||0)+e.s; }
  W.hist = W.hist.filter(x => String(x.id)!==String(id));
  sv(); rSterne();
}
function getStarsTrend(kid, days) {
  const out = [];
  for (let i=days-1; i>=0; i--) {
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    const dk = isoDate(d);
    const net = (W.hist||[]).filter(e => e.kid===kid && e.date===dk).reduce((a,e) => a + (e.type==="award"?e.s:-e.s), 0);
    out.push({date:d, net});
  }
  return out;
}
function confirmReq(id) {
  const r=(W.reqs||[]).find(x=>x.id===id); if(!r)return; r.status="confirmed"; awardS(r.kid,r.s,r.tn);
}
function rejectReq(id) {
  const r=(W.reqs||[]).find(x=>x.id===id); if(r)r.status="rejected"; sv(); rSterne();
}
function saveTask(kid, id) {
  const n=document.getElementById("etn")?.value.trim();
  const s=parseInt(document.getElementById("ets")?.value)||1;
  if(!n)return;
  const t=W.tasks[kid]?.find(x=>x.id===id);
  if(t){t.n=n;t.s=Math.min(10,Math.max(1,s));}
  W.taskEdit=null; sv(); rSterne();
}
function addTask(kid) {
  const n=document.getElementById("ntn")?.value.trim();
  const s=parseInt(document.getElementById("nts")?.value)||1;
  if(!n)return;
  if(!W.tasks[kid])W.tasks[kid]=[];
  W.tasks[kid].push({id:"u"+Date.now(),n,s:Math.min(10,Math.max(1,s))});
  W.taskEdit=null; W.showNT=false; sv(); rSterne();
}

function rSterne() {
  migrateHistIds();
  const kid=W.sk, st=W.stars[kid]||0, tot=W.total[kid]||0;
  const tasks=W.tasks[kid]||[];
  let h = `<div style="color:white;font-weight:800;font-size:15px;margin-bottom:7px">Belohnungssystem</div>`;
  // Kid selector
  h += `<div style="display:flex;gap:7px;margin-bottom:8px"><div style="display:flex;background:rgba(255,255,255,0.15);border-radius:11px;padding:3px;gap:2px;flex:1">`;
  W.kids.map(k=>({id:k.id,n:k.name})).forEach(k => {
    const on=kid===k.id;
    h += `<button style="flex:1;padding:6px;border-radius:8px;border:none;background:${on?"white":"transparent"};color:${on?"#764ba2":"white"};font-weight:800;font-size:12px;cursor:pointer" onclick="W.sk='${k.id}';sv();rSterne()">${k.n}</button>`;
  });
  h += `</div></div>`;
  // Pending requests
  const pend=(W.reqs||[]).filter(r=>r.kid===kid&&r.status==="pending");
  if (pend.length) {
    h += `<div class="card" style="border-left:4px solid #ff9800"><div class="ct" style="color:#e65100">Anfragen von ${kidName(kid)} (${pend.length})</div>`;
    pend.forEach(r => {
      h += `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd2)"><div style="font-size:12px;font-weight:600">${r.tn} (${r.s} Sterne)</div><div style="display:flex;gap:5px"><button data-confirm-req="${r.id}" style="background:#4caf50;color:white;border:none;border-radius:7px;padding:5px 9px;font-weight:800;font-size:11px;cursor:pointer">OK</button><button data-reject-req="${r.id}" style="background:#ffebee;color:#f44336;border:none;border-radius:7px;padding:5px 9px;font-weight:800;font-size:11px;cursor:pointer">Nein</button></div></div>`;
    });
    h += `</div>`;
  }
  // Stars display
  h += `<div class="card"><div style="text-align:center;padding:8px 0"><div style="font-size:52px;font-weight:900;color:#f57f17;line-height:1">${st}</div><div style="font-size:12px;color:var(--t2);margin-top:2px">Sterne (gesamt: ${tot})</div></div></div>`;
  // Verlauf letzte 7 Tage
  const trend = getStarsTrend(kid, 7);
  const maxNet = Math.max(1, ...trend.map(t=>t.net));
  h += `<div class="card"><div class="ct">Verlauf letzte 7 Tage</div><div style="display:flex;gap:4px">`
    + trend.map(t => {
      const pc2 = Math.max(6, Math.round((Math.max(0,t.net)/maxNet)*100));
      return `<div style="flex:1;text-align:center"><div style="font-size:9px;color:var(--t2);margin-bottom:2px">${t.net}</div><div style="height:28px;display:flex;align-items:flex-end"><div style="width:100%;height:${pc2}%;background:linear-gradient(180deg,#ff9800,#f57f17);border-radius:3px 3px 0 0"></div></div><div style="font-size:8px;color:var(--t3);margin-top:2px">${DAYS[(t.date.getDay()+6)%7]}</div></div>`;
    }).join("")
    + `</div></div>`;
  // Next reward
  const nr=W.rew.filter(r=>r.s>st).sort((a,b)=>a.s-b.s)[0];
  if (nr) {
    const pc=Math.round(st/nr.s*100);
    h += `<div class="card"><div class="ct">Naechste Belohnung: ${nr.n}</div><div class="bw"><div class="bf" style="width:${pc}%;background:linear-gradient(90deg,#f57f17,#ff9800)"></div></div><div style="font-size:11px;color:var(--t2);text-align:center;margin-top:4px">${st} von ${nr.s} Sternen</div></div>`;
  }
  // Tasks
  h += `<div style="color:white;font-weight:800;font-size:14px;margin-bottom:7px">Aufgaben</div>`;
  tasks.forEach(t => {
    if (W.taskEdit===t.id) {
      h += `<div class="card"><div class="ct">Aufgabe bearbeiten</div><input id="etn" value="${t.n}" class="fi" placeholder="Name"><input id="ets" type="number" value="${t.s}" class="fi" placeholder="Sterne" min="1" max="10"><div style="display:flex;gap:6px"><button data-task-save="${t.id}" data-kid="${kid}" class="sb" style="flex:1;margin:0">Speichern</button><button data-task-del="${t.id}" data-task-del="${t.id}" data-kid="${kid}" style="flex:1;background:#ffebee;color:#f44336;border:none;border-radius:9px;padding:9px;font-weight:800;cursor:pointer">Loeschen</button></div></div>`;
    } else {
      h += `<div class="task-row"><div style="flex:1"><div style="font-weight:700;font-size:13px">${t.n}</div><div style="font-size:11px;color:var(--t2)">${t.s} Stern${t.s>1?"e":""}</div></div><button data-award="1" data-kid="${kid}" data-s="${t.s}" data-n="${t.n}" class="award">+${t.s}</button><button data-task-edit="${t.id}" style="background:#ede9ff;color:#764ba2;border:none;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer">Bearb.</button></div>`;
    }
  });
  h += `<div class="card"><button data-toggle-nt="1" style="width:100%;background:var(--hb);color:var(--t2);border:none;border-radius:9px;padding:8px;font-size:11px;font-weight:700;cursor:pointer;text-align:left">+ Eigene Aufgabe</button>`;
  if (W.showNT) {
    h += `<div style="margin-top:8px"><input id="ntn" class="fi" placeholder="Aufgabe (z.B. Buch lesen)"><input id="nts" type="number" class="fi" placeholder="Sterne (1-10)"><button data-add-task="${kid}" class="sb">Hinzufuegen</button></div>`;
  }
  h += `</div>`;
  // Rewards
  h += `<div style="color:white;font-weight:800;font-size:14px;margin-bottom:7px">Belohnungen einloesen</div>`;
  W.rew.forEach(r => {
    const can=st>=r.s;
    h += `<div class="card" style="display:flex;align-items:center;gap:10px"><div style="flex:1"><div style="font-weight:700;font-size:13px">${r.n}</div><div style="font-size:11px;color:var(--t2)">${r.s} Sterne${can?" - verfuegbar!":""}</div></div>`;
    if (can) {
      h += `<button data-redeem="1" data-kid="${kid}" data-s="${r.s}" data-n="${r.n}" style="background:${r.c};color:white;border:none;border-radius:9px;padding:8px 12px;font-size:11px;font-weight:800;cursor:pointer">Einloesen</button>`;
    } else {
      h += `<div style="background:#ddd;color:white;border-radius:9px;padding:8px 12px;font-size:11px;font-weight:800">Warten</div>`;
    }
    h += `</div>`;
  });
  // History
  if (W.hist.length) {
    h += `<div class="card"><div class="ct">Letzte Aktivitaeten</div>`;
    W.hist.slice(-5).reverse().forEach(e => {
      h += `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd2);font-size:12px"><span>${kidName(e.kid)}: ${e.n}</span><span style="display:flex;align-items:center;gap:8px"><span style="color:${e.type==="award"?"#4caf50":"#f44336"};font-weight:700">${e.type==="award"?"+":"-"}${e.s}</span><button data-hist-del="${e.id}" style="background:none;border:none;color:var(--t4);font-size:14px;cursor:pointer;line-height:1;padding:2px">&#128465;</button></span></div>`;
    });
    h += `</div>`;
  }
  document.getElementById("t-sterne").innerHTML = h;
}

function rSchule() {
  const nf=gNF();
  let h = `<div style="color:white;font-weight:800;font-size:15px;margin-bottom:7px">Schule - Alia</div>`;
  if (nf.length) {
    const f=nf[0], du=dU(f.v);
    if (du<=14) h += `<div style="background:${du<=0?"#c8e6c9":"#fff3e0"};border-radius:13px;padding:12px 14px;margin-bottom:8px;border-left:5px solid ${du<=0?"#4caf50":"#ff9800"}"><div style="font-weight:800;font-size:13px;color:${du<=0?"#2e7d32":"#e65100"}">${f.n}${du<=0?" - Schulfrei!":" in "+du+" Tagen!"}</div><div style="font-size:11px;color:#666;margin-top:2px">${fmtD(f.v)} - ${fmtD(f.b)}</div></div>`;

  h += `<div class="card"><div class="ct">Stundenplan</div><div class="sg">`;

function saveApt() {
  const ti=document.getElementById("nati")?.value.trim(); if(!ti)return;
  const once = document.getElementById("natOnce")?.checked;
  const apt = {id:Date.now(), title:ti, who:document.getElementById("naw")?.value||"Familie", color:"#26a69a"};
  if (once) {
    const dv = document.getElementById("nadate")?.value; if(!dv) return;
    apt.date = dv; apt.day = DAYS[(new Date(dv+"T00:00:00").getDay()+6)%7]; apt.time = document.getElementById("nat2")?.value;
  } else {
    const freq = document.getElementById("naf")?.value || "weekly";
    apt.freq = freq;
    if (freq === "monthly") {
      apt.dayOfMonth = Math.min(31, Math.max(1, parseInt(document.getElementById("nadom")?.value) || 1));
      apt.time = document.getElementById("natm")?.value;
    } else {
      apt.day = document.getElementById("nad")?.value; apt.time = document.getElementById("nat")?.value;
      if (freq === "biweekly") apt.startWeek = curWeekKey();
    }
  }
  W.apts.push(apt);
  W.showAF=false; W.quickAddDate=null; sv(); rTermine();
}
function saveRec(id) {
  const r=W.rec.find(x=>x.id===id); if(!r)return;

}
function rCalendar() {
  const view = W.calView || "monat";

    + `<button data-cal-view="woche" style="border:none;border-radius:6px;padding:4px 9px;font-size:10px;font-weight:700;cursor:pointer;background:${view==="woche"?"#764ba2":"transparent"};color:${view==="woche"?"white":"var(--t2)"}">Woche</button>`

      + `<button data-cal-nav="-1" style="background:var(--hb);color:#764ba2;border:none;border-radius:8px;width:28px;height:28px;font-weight:800;cursor:pointer">&#8249;</button>`
      + `<b style="font-size:13px;color:var(--t1)">${monthNames[month]} ${year}</b>`
      + `<button data-cal-nav="1" style="background:var(--hb);color:#764ba2;border:none;border-radius:8px;width:28px;height:28px;font-weight:800;cursor:pointer">&#8250;</button>`
      + `</div><div style="display:flex;justify-content:center;margin-bottom:8px">${viewToggle}</div>`;
    h += `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px">`
      + DAYS.map(x=>`<div style="text-align:center;font-size:9px;font-weight:800;color:var(--t3)">${x}</div>`).join("")
      + `</div>`;
    const multiDayItems = (W.imported||[]).filter(e => e.dateEnd && e.dateEnd !== e.date);
    for (let w = 0; w < days.length; w += 7) {
      const weekDays = days.slice(w, w+7);

      const spans = multiDayItems.filter(e => e.date <= weekEndIso && e.dateEnd >= weekStartIso);
      spans.forEach(e => {

        const startCol = weekDays.findIndex(d => isoDate(d) === clipStartIso) + 1;
        const endCol = weekDays.findIndex(d => isoDate(d) === clipEndIso) + 1;
        const trueStart = e.date >= weekStartIso, trueEnd = e.dateEnd <= weekEndIso;
        const radius = `${trueStart?"4px":"0"} ${trueEnd?"4px":"0"} ${trueEnd?"4px":"0"} ${trueStart?"4px":"0"}`;
        const c = personColorsForWho(e.who)[0];

          + `<div data-cal-jump="${clipStartIso}" style="grid-column:${startCol} / span ${endCol-startCol+1};min-width:0;background:${c};color:white;font-size:7px;line-height:1.6;padding:0 4px;border-radius:${radius};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer">${trueStart?"&#128241; "+esc(e.title):"&nbsp;"}</div>`
          + `</div>`;

      if (ferien) monthFerien.add(ferien.n);
      if (feiertag) monthFeiertage.push({n:feiertag.n, d:vd});
      const isToday = dtI===todayIso;
      const all=[...W.rec.filter(r=>recOccursOn(r, vd)),...W.apts.filter(a=>a.date?(a.date===dtI&&a.day===dd):recOccursOn(a, vd)),...importedOnDate(dtI)];

        + `<div style="width:28px;flex-shrink:0;padding-top:2px"><div style="font-weight:900;font-size:11px;color:${feiertag?"#c62828":"#764ba2"}">${dd}</div><div style="font-size:8px;color:var(--t3)">${fmtDshort(vd)}</div></div>`
        + `<div class="wt">`;
      if (all.length) all.forEach(a => { const c=a.imported?personColorsForWho(a.who)[0]:(a.color||"#764ba2"); h += `<span class="wtg" style="background:${c}15;color:${c}">${a.imported?"&#128241; ":""}${esc(a.title)}</span>`; });
      else h += `<span style="font-size:10px;color:var(--t4)">frei</span>`;

  }
  h += `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:10px;color:var(--t2)">`
    + [...W.kids, ...(W.parents||[])].map(p => `<span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:${PERSON_COLORS[p.id]||"#999"}"></span>${esc(p.name)}</span>`).join("")

      + monthFeiertage.map(f=>`&#127881; ${esc(f.n)} (${fmtDshort(f.d)})`).join("<br>")
      + `</div>`;
  }
  h += `</div>`;
  return h;
}

    wpItems.forEach(x => {
      const k="wp-"+x, c=W.chk[k];
      h += `<div class="si" data-chk="${k}"><div class="chkbox${c?" on":""}">${c?"v":""}</div><span style="font-size:12px;color:${c?"var(--t3)":"var(--t1)"};text-decoration:${c?"line-through":"none"}">${x}</span></div>`;
    });
    h += `</div>`;
  }
  SHOP.forEach((cat,ci) => {
    const dn=cat.i.filter((x,ii)=>W.chk[ci+"-"+ii]).length;
    h += `<div class="card" style="${dn===cat.i.length?"opacity:.7":""}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><div class="ct" style="margin:0">${cat.c}</div><span style="font-size:10px;font-weight:700;color:${dn===cat.i.length?"#4caf50":"#aaa"}">${dn===cat.i.length?"Fertig":dn+"/"+cat.i.length}</span></div>`;
    cat.i.forEach((x,ii) => {
      const k=`${ci}-${ii}`, c=W.chk[k];
      h += `<div class="si" data-chk="${k}"><div class="chkbox${c?" on":""}">${c?"v":""}</div><span style="font-size:12px;color:${c?"var(--t3)":"var(--t1)"};text-decoration:${c?"line-through":"none"}">${x}</span></div>`;
    });
    h += `</div>`;
  });
  h += `<div class="card"><div class="ct">Daten sichern</div><div style="font-size:11px;color:var(--t2);margin-bottom:8px">Alle Daten (Termine, Sterne, Aufgaben, Haken) als Datei sichern oder auf einem neuen Geraet wiederherstellen.</div><button data-export-backup="1" class="sb">Backup herunterladen</button><label style="display:block;text-align:center;margin-top:6px;cursor:pointer;background:var(--hb);color:var(--t2);border-radius:9px;padding:7px 12px;font-size:11px;font-weight:700">Backup wiederherstellen<input type="file" id="backupFile" accept="application/json" style="display:none"></label></div>`;
  document.getElementById("t-einkauf").innerHTML = h;
  const bf = document.getElementById("backupFile");
  if (bf) bf.onchange = () => importBackup(bf.files[0]);
}

// SPORT
function saveSched() {
  const ti=document.getElementById("nsti")?.value.trim(); if(!ti)return;
  W.sched.push({id:"u"+Date.now(),day:document.getElementById("nsd")?.value,type:document.getElementById("nst")?.value,title:ti,who:document.getElementById("nstw")?.value||"Familie"});
  W.showSF=false; sv(); rSport();
}
function getSportTally() {
  const people = [...W.kids, ...(W.parents||[])].map(p=>p.name);
  const tally = {};
  people.forEach(n => tally[n] = 0);
  W.sched.forEach(s => { people.forEach(n => { if ((s.who||"").includes(n)) tally[n]++; }); });
  return tally;
}
function rSport() {
  const d=DAYS[W.day], its=W.sched.filter(s=>s.day===d);
  const whoOpts = ["Familie","Kinder",...W.kids.map(k=>k.name),...(W.parents||[]).map(p=>p.name)];
  let h = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><div style="color:white;font-weight:800;font-size:15px">Bewegung - ${d}</div><button data-toggle-sf="1" style="background:white;color:#764ba2;border:none;border-radius:9px;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer">+ Aktivitaet</button></div>`;
  if (W.showSF) {
    h += `<div class="card"><div class="ct">Neue Aktivitaet</div><div style="display:flex;gap:6px;margin-bottom:6px"><select id="nsd" style="flex:1;padding:7px;border-radius:8px;border:2px solid var(--bd);background:var(--ib);color:var(--t1);font-size:12px">${DAYS.map(x=>`<option${x===d?" selected":""}>${x}</option>`).join("")}</select><select id="nst" style="flex:1;padding:7px;border-radius:8px;border:2px solid var(--bd);background:var(--ib);color:var(--t1);font-size:12px"><option value="training">Training</option><option value="lernen">Lernen</option><option value="ruhe">Ruhe</option></select></div><input id="nsti" class="fi" placeholder="Titel (z.B. Fussball, Wandern)"><select id="nstw" style="width:100%;box-sizing:border-box;padding:9px;border-radius:9px;border:2px solid var(--bd);background:var(--ib);color:var(--t1);font-size:13px;margin-bottom:8px">${whoOpts.map(n=>`<option${n==="Familie"?" selected":""}>${esc(n)}</option>`).join("")}</select><button data-save-sched="1" class="sb">Speichern</button></div>`;
  }
  if (!its.length) h += `<div class="eb">Freier Tag</div>`;
  its.forEach(s => {
    const c=TC[s.type];
    h += `<div class="spk" style="background:${c.bg};border-color:${c.bd}"><div style="display:flex;align-items:center;gap:7px"><div style="flex:1"><div style="font-weight:800;font-size:13px;color:${c.tx}">${s.title}</div><div style="font-size:10px;color:${c.tx};opacity:.7">${s.who}</div></div><span style="background:${c.bd}30;color:${c.tx};border-radius:6px;padding:2px 6px;font-size:9px;font-weight:700">${c.lb}</span><button data-sched-del="${s.id}" class="dlb">x</button></div></div>`;
  });
  h += `<div style="color:white;font-weight:800;font-size:14px;margin-top:12px;margin-bottom:7px">Wochenplan</div><div class="card">`;
  DAYS.forEach(dd => {
    const i2=W.sched.filter(s=>s.day===dd);
    h += `<div class="wr"><div style="width:24px;font-weight:900;font-size:11px;color:#764ba2;padding-top:2px;flex-shrink:0">${dd}</div><div class="wt">`;
    if (i2.length) i2.forEach(s => { const c=TC[s.type]; h += `<span class="wtg" style="background:${c.bg};color:${c.tx}">${s.title}</span>`; });
    else h += `<span style="font-size:10px;color:var(--t4)">Frei</span>`;
    h += `</div></div>`;
  });
  h += `</div>`;
  const tally = getSportTally(), maxT = Math.max(1, ...Object.values(tally));
  h += `<div style="color:white;font-weight:800;font-size:14px;margin-top:12px;margin-bottom:7px">Aktivitaeten pro Person (Woche)</div><div class="card">`
    + Object.entries(tally).map(([n,c]) => `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="width:52px;font-size:11px;font-weight:700;color:var(--t1);flex-shrink:0">${esc(n)}</span><div style="flex:1;background:var(--sb);border-radius:5px;height:10px;overflow:hidden"><div style="width:${Math.round(c/maxT*100)}%;height:100%;background:#764ba2;border-radius:5px"></div></div><span style="font-size:11px;font-weight:700;color:var(--t2);width:16px;text-align:right">${c}</span></div>`).join("")
    + `</div>`;
  document.getElementById("t-sport").innerHTML = h;
}

// INIT
ld();
migrateMealOv();
migrateHistIds();
renderHeader();
if (isUnlocked()) { showScr("start"); } else { showScr("lock"); renderLockUI(); }
initCloudSync();
try {
  const last = Number(localStorage.getItem("fs11-evaSyncAt") || 0);
  if (Date.now() - last > 20*60*1000) {
    localStorage.setItem("fs11-evaSyncAt", String(Date.now()));
    fetch("/api/sync-eva").catch(()=>{});
  }
} catch(e) {}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
