body{font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
button{cursor:pointer;font-family:inherit}

.card{background:white;border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
.ct{color:#764ba2;font-weight:800;font-size:12px;margin-bottom:8px}
.tag{border-radius:7px;padding:2px 7px;font-size:10px;font-weight:700}
.bw{background:#f0f0f0;border-radius:6px;height:8px;overflow:hidden}
.bf{height:100%;border-radius:6px}
.sb{width:100%;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;border-radius:9px;padding:9px;font-weight:800;font-size:13px;margin-top:5px;cursor:pointer}
.fi{width:100%;padding:7px 10px;border-radius:8px;border:2px solid #eee;font-size:12px;margin-bottom:5px}
.dlb{background:#ffebee;color:#f44336;border:none;border-radius:6px;width:28px;height:28px;font-size:13px;font-weight:800;cursor:pointer}
.tb{flex:0 0 auto;padding:6px 8px;border-radius:9px;border:none;background:transparent;color:white;font-weight:700;font-size:9.5px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.tb span{font-size:13px}
.tb.on{background:white;color:#764ba2}
.si{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #f5f5f5;align-items:center;cursor:pointer}
.chkbox{min-width:19px;height:19px;border-radius:5px;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:white}
.chkbox.on{background:#764ba2;border-color:#764ba2}
.wr{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start}
.wt{display:flex;flex-wrap:wrap;gap:3px}
.wtg{border-radius:6px;padding:1px 6px;font-size:10px;font-weight:600}
.spk{border-radius:13px;padding:11px 13px;margin-bottom:7px;border-left:5px solid}
.sg{display:grid;grid-template-columns:38px repeat(5,1fr);gap:2px;font-size:9px}
.sc{border-radius:4px;padding:3px 2px;text-align:center;font-weight:600;min-height:30px;display:flex;align-items:center;justify-content:center;line-height:1.2}
.sh{background:#764ba2;color:white;font-weight:800}
.sm{background:#ede9ff;color:#764ba2;font-weight:700;font-size:8px}
.sf{color:white;font-weight:700}
.ff{background:transparent!important;color:#ccc!important}
.fd{background:#2e7d32}.fm{background:#1565c0}.fe2{background:#6a1b9a}
.fsk{background:#e65100}.fk{background:#ad1457}.fsp{background:#00695c}
.fmu{background:#4527a0}.fr{background:#37474f}.fw{background:#5d4037}
.fc{border-radius:13px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;background:white;box-shadow:0 3px 12px rgba(0,0,0,0.08)}
.pin-btn{width:70px;height:70px;border-radius:50%;background:white;border:3px solid #e0e0e0;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,0.1)}
.ktask{background:white;border-radius:18px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.doneBtn{color:white;border:none;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:900;cursor:pointer;flex-shrink:0}
.task-row{background:white;border-radius:13px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 12px rgba(0,0,0,0.08)}
.award{background:linear-gradient(135deg,#f57f17,#ff9800);color:white;border:none;border-radius:9px;padding:7px 11px;font-size:11px;font-weight:800;flex-shrink:0;cursor:pointer}
.profbtn{border:none;border-radius:20px;padding:18px 12px;font-weight:900;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,0.25);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex:1}
.screen{display:none;min-height:100vh}

    </div>
  </div>
  <div id="day-row" style="display:flex;gap:5px;padding:7px 10px 4px;overflow-x:auto;scrollbar-width:none"></div>
  <div id="tab-row" style="display:flex;margin:4px 10px;background:rgba(255,255,255,0.15);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none">
    <button class="tb on" data-tab="plan"><span>&#127869;</span>Essen</button>
    <button class="tb" data-tab="sterne"><span>&#11088;</span>Sterne</button>
    <button class="tb" data-tab="schule"><span>&#127890;</span>Schule</button>
    <button class="tb" data-tab="termine"><span>&#128197;</span>Termine</button>

    <button class="tb" data-tab="sport"><span>&#127939;</span>Sport</button>

  <div style="padding:0 10px">
    <div id="t-plan"></div>
    <div id="t-sterne" style="display:none"></div>
    <div id="t-schule" style="display:none"></div>

// SCREENS
function showScr(id) {
  document.querySelectorAll(".screen").forEach(s => s.style.display = "none");
  const el = document.getElementById("scr-"+id);
  if (el) el.style.display = (id === "pin") ? "flex" : "block";
}

// EVENT DELEGATION
document.addEventListener("click", function(e) {
  const t = e.target.closest("[data-goto-start]");
  if (t) { showScr("start"); return; }
  const ge = e.target.closest("[data-goto-eltern]");
  if (ge) { showScr("pin"); pinBuf=""; renderPinUI(); return; }
  const gk = e.target.closest("[data-goto-kind]");
  if (gk) { W.sk = gk.dataset.gotoKind; W.ktab="s"; sv(); showScr("kids"); renderKids(); updateKTabs(); return; }
  const kt = e.target.closest("[data-ktab]");
  if (kt) { W.ktab = kt.dataset.ktab; sv(); renderKids(); updateKTabs(); return; }
  const tb = e.target.closest("[data-tab]");
  if (tb) { setTab(tb.dataset.tab); return; }
  const dr = e.target.closest("[data-day]");
  if (dr) { W.day=parseInt(dr.dataset.day); sv(); renderDays(); renderCurrent(); return; }
  const pk = e.target.closest("[data-pin]");
  if (pk) { pinKey(pk.dataset.pin); return; }
  const aw = e.target.closest("[data-award]");
  if (aw) { awardS(aw.dataset.kid, parseInt(aw.dataset.s), aw.dataset.n); return; }
  const te = e.target.closest("[data-task-edit]");
  if (te) { W.taskEdit = W.taskEdit===te.dataset.taskEdit?null:te.dataset.taskEdit; sv(); rSterne(); return; }
  const td = e.target.closest("[data-task-del]");
  if (td) { W.tasks[td.dataset.kid] = W.tasks[td.dataset.kid].filter(t=>t.id!==td.dataset.taskDel); W.taskEdit=null; sv(); rSterne(); return; }
  const ts = e.target.closest("[data-task-save]");
  if (ts) { saveTask(ts.dataset.kid, ts.dataset.taskSave); return; }
  const ra = e.target.closest("[data-redeem]");
  if (ra) { redeemR(ra.dataset.kid, parseInt(ra.dataset.s), ra.dataset.n); return; }
  const cr = e.target.closest("[data-confirm-req]");
  if (cr) { confirmReq(parseInt(cr.dataset.confirmReq)); return; }
  const rj = e.target.closest("[data-reject-req]");
  if (rj) { rejectReq(parseInt(rj.dataset.rejectReq)); return; }
  const req = e.target.closest("[data-req-task]");
  if (req) { reqTask(req.dataset.kid, req.dataset.tid, req.dataset.tn, parseInt(req.dataset.s)); return; }
  const re = e.target.closest("[data-rec-edit]");
  if (re) { W.recEdit=W.recEdit===re.dataset.recEdit?null:re.dataset.recEdit; sv(); rTermine(); return; }
  const rs = e.target.closest("[data-rec-save]");
  if (rs) { saveRec(rs.dataset.recSave); return; }
  const rd = e.target.closest("[data-rec-del]");
  if (rd) { W.rec=W.rec.filter(r=>r.id!==rd.dataset.recDel); W.recEdit=null; sv(); rTermine(); return; }
  const ad = e.target.closest("[data-apt-del]");
  if (ad) { W.apts=W.apts.filter(a=>a.id!==parseInt(ad.dataset.aptDel)); sv(); rTermine(); return; }
  const sd = e.target.closest("[data-sched-del]");
  if (sd) { W.sched=W.sched.filter(s=>s.id!==sd.dataset.schedDel); sv(); rSport(); return; }
  const ck = e.target.closest("[data-chk]");
  if (ck) { const k=ck.dataset.chk; W.chk[k]=!W.chk[k]; sv(); rEinkauf(); return; }
  const af = e.target.closest("[data-toggle-af]");
  if (af) { W.showAF=!W.showAF; sv(); rTermine(); return; }
  const sf = e.target.closest("[data-toggle-sf]");
  if (sf) { W.showSF=!W.showSF; sv(); rSport(); return; }
  const nt = e.target.closest("[data-toggle-nt]");
  if (nt) { W.showNT=!W.showNT; sv(); rSterne(); return; }
  const apt = e.target.closest("[data-save-apt]");
  if (apt) { saveApt(); return; }
  const sa = e.target.closest("[data-save-sched]");
  if (sa) { saveSched(); return; }
  const na = e.target.closest("[data-add-task]");
  if (na) { addTask(na.dataset.addTask); return; }
});

// PIN
let pinBuf = "";
function renderPinUI() {
  const dots = document.getElementById("pin-dots");
  const grid = document.getElementById("pin-grid");
  if (!dots || !grid) return;
  dots.innerHTML = [0,1,2,3].map(i =>
    `<div style="width:16px;height:16px;border-radius:50%;background:${i<pinBuf.length?"white":"rgba(255,255,255,0.3)"};border:2px solid white"></div>`
  ).join("");
  grid.innerHTML = ["1","2","3","4","5","6","7","8","9","","0","X"].map(b =>
    b ? `<button class="pin-btn" data-pin="${b}">${b==="X"?"&#9003;":b}</button>` : `<div></div>`
  ).join("");
}
function pinKey(k) {
  if (k==="X") { pinBuf=pinBuf.slice(0,-1); renderPinUI(); return; }
  pinBuf += k;
  renderPinUI();
  if (pinBuf.length >= 4) {
    if (pinBuf === W.pin) {
      showScr("app"); renderDays(); renderCurrent();
    } else {
      const e = document.getElementById("pin-err");
      if (e) e.textContent = "Falscher PIN!";
      setTimeout(() => { pinBuf=""; renderPinUI(); if(e) e.textContent=""; }, 1000);
    }
  }
}

// STERNE
function awardS(kid, s, n) {
  W.stars[kid]=(W.stars[kid]||0)+s; W.total[kid]=(W.total[kid]||0)+s;
  W.hist.push({kid,n,s,type:"award"}); if(W.hist.length>20)W.hist.shift();
  sv(); rSterne();
}
function redeemR(kid, s, n) {
  if ((W.stars[kid]||0)<s) return;
  W.stars[kid]-=s; W.hist.push({kid,n,s,type:"redeem"}); sv(); rSterne();
}
function confirmReq(id) {
  const r=(W.reqs||[]).find(x=>x.id===id); if(!r)return; r.status="confirmed"; awardS(r.kid,r.s,r.tn);
}
function rejectReq(id) {
  const r=(W.reqs||[]).find(x=>x.id===id); if(r)r.status="rejected"; sv(); rSterne();
}
function saveTask(kid, id) {
  const n=document.getElementById("etn")?.value.trim();
  const s=parseInt(document.getElementById("ets")?.value)||1;
  if(!n)return;
  const t=W.tasks[kid]?.find(x=>x.id===id);
  if(t){t.n=n;t.s=Math.min(10,Math.max(1,s));}
  W.taskEdit=null; sv(); rSterne();
}
function addTask(kid) {
  const n=document.getElementById("ntn")?.value.trim();
  const s=parseInt(document.getElementById("nts")?.value)||1;
  if(!n)return;
  if(!W.tasks[kid])W.tasks[kid]=[];
  W.tasks[kid].push({id:"u"+Date.now(),n,s:Math.min(10,Math.max(1,s))});
  W.taskEdit=null; W.showNT=false; sv(); rSterne();
}

function rSterne() {
  const kid=W.sk, st=W.stars[kid]||0, tot=W.total[kid]||0;
  const tasks=W.tasks[kid]||[];
  let h = `<div style="color:white;font-weight:800;font-size:15px;margin-bottom:7px">Belohnungssystem</div>`;
  // Kid selector
  h += `<div style="display:flex;gap:7px;margin-bottom:8px"><div style="display:flex;background:rgba(255,255,255,0.15);border-radius:11px;padding:3px;gap:2px;flex:1">`;
  [{id:"alia",n:"Alia"},{id:"tiana",n:"Tiana"}].forEach(k => {
    const on=kid===k.id;
    h += `<button data-award="${k.id}" style="flex:1;padding:6px;border-radius:8px;border:none;background:${on?"white":"transparent"};color:${on?"#764ba2":"white"};font-weight:800;font-size:12px;cursor:pointer" onclick="W.sk='${k.id}';sv();rSterne()">${k.n}</button>`;
  });
  h += `</div></div>`;
  // Pending requests
  const pend=(W.reqs||[]).filter(r=>r.kid===kid&&r.status==="pending");
  if (pend.length) {
    h += `<div class="card" style="border-left:4px solid #ff9800"><div class="ct" style="color:#e65100">Anfragen von ${kid==="alia"?"Alia":"Tiana"} (${pend.length})</div>`;
    pend.forEach(r => {
      h += `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f5f5f5"><div style="font-size:12px;font-weight:600">${r.tn} (${r.s} Sterne)</div><div style="display:flex;gap:5px"><button data-confirm-req="${r.id}" style="background:#4caf50;color:white;border:none;border-radius:7px;padding:5px 9px;font-weight:800;font-size:11px;cursor:pointer">OK</button><button data-reject-req="${r.id}" style="background:#ffebee;color:#f44336;border:none;border-radius:7px;padding:5px 9px;font-weight:800;font-size:11px;cursor:pointer">Nein</button></div></div>`;
    });
    h += `</div>`;
  }
  // Stars display
  h += `<div class="card"><div style="text-align:center;padding:8px 0"><div style="font-size:52px;font-weight:900;color:#f57f17;line-height:1">${st}</div><div style="font-size:12px;color:#888;margin-top:2px">Sterne (gesamt: ${tot})</div></div></div>`;
  // Next reward
  const nr=W.rew.filter(r=>r.s>st).sort((a,b)=>a.s-b.s)[0];
  if (nr) {
    const pc=Math.round(st/nr.s*100);
    h += `<div class="card"><div class="ct">Naechste Belohnung: ${nr.n}</div><div class="bw"><div class="bf" style="width:${pc}%;background:linear-gradient(90deg,#f57f17,#ff9800)"></div></div><div style="font-size:11px;color:#888;text-align:center;margin-top:4px">${st} von ${nr.s} Sternen</div></div>`;
  }
  // Tasks
  h += `<div style="color:white;font-weight:800;font-size:14px;margin-bottom:7px">Aufgaben</div>`;
  tasks.forEach(t => {
    if (W.taskEdit===t.id) {
      h += `<div class="card"><div class="ct">Aufgabe bearbeiten</div><input id="etn" value="${t.n}" class="fi" placeholder="Name"><input id="ets" type="number" value="${t.s}" class="fi" placeholder="Sterne" min="1" max="10"><div style="display:flex;gap:6px"><button data-task-save="${t.id}" data-kid="${kid}" class="sb" style="flex:1;margin:0">Speichern</button><button data-task-del="${t.id}" data-task-del="${t.id}" data-kid="${kid}" style="flex:1;background:#ffebee;color:#f44336;border:none;border-radius:9px;padding:9px;font-weight:800;cursor:pointer">Loeschen</button></div></div>`;
    } else {
      h += `<div class="task-row"><div style="flex:1"><div style="font-weight:700;font-size:13px">${t.n}</div><div style="font-size:11px;color:#888">${t.s} Stern${t.s>1?"e":""}</div></div><button data-award="1" data-kid="${kid}" data-s="${t.s}" data-n="${t.n}" class="award">+${t.s}</button><button data-task-edit="${t.id}" style="background:#ede9ff;color:#764ba2;border:none;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer">Bearb.</button></div>`;
    }
  });
  h += `<div class="card"><button data-toggle-nt="1" style="width:100%;background:#f5f5f5;color:#666;border:none;border-radius:9px;padding:8px;font-size:11px;font-weight:700;cursor:pointer;text-align:left">+ Eigene Aufgabe</button>`;
  if (W.showNT) {
    h += `<div style="margin-top:8px"><input id="ntn" class="fi" placeholder="Aufgabe (z.B. Buch lesen)"><input id="nts" type="number" class="fi" placeholder="Sterne (1-10)"><button data-add-task="${kid}" class="sb">Hinzufuegen</button></div>`;
  }
  h += `</div>`;
  // Rewards
  h += `<div style="color:white;font-weight:800;font-size:14px;margin-bottom:7px">Belohnungen einloesen</div>`;
  W.rew.forEach(r => {
    const can=st>=r.s;
    h += `<div class="card" style="display:flex;align-items:center;gap:10px"><div style="flex:1"><div style="font-weight:700;font-size:13px">${r.n}</div><div style="font-size:11px;color:#888">${r.s} Sterne${can?" - verfuegbar!":""}</div></div>`;
    if (can) {
      h += `<button data-redeem="1" data-kid="${kid}" data-s="${r.s}" data-n="${r.n}" style="background:${r.c};color:white;border:none;border-radius:9px;padding:8px 12px;font-size:11px;font-weight:800;cursor:pointer">Einloesen</button>`;
    } else {
      h += `<div style="background:#ddd;color:white;border-radius:9px;padding:8px 12px;font-size:11px;font-weight:800">Warten</div>`;
    }
    h += `</div>`;
  });
  // History
  if (W.hist.length) {
    h += `<div class="card"><div class="ct">Letzte Aktivitaeten</div>`;
    W.hist.slice(-5).reverse().forEach(e => {
      h += `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f5f5f5;font-size:12px"><span>${e.kid==="alia"?"Alia":"Tiana"}: ${e.n}</span><span style="color:${e.type==="award"?"#4caf50":"#f44336"};font-weight:700">${e.type==="award"?"+":"-"}${e.s}</span></div>`;
    });
    h += `</div>`;
  }
  document.getElementById("t-sterne").innerHTML = h;
  // Re-attach kid selector onclick (data-award used for both kids and tasks - fix)
  document.querySelectorAll("#t-sterne [data-award]").forEach(b => {
    if (b.dataset.kid && b.dataset.s && b.dataset.n) {
      b.onclick = () => awardS(b.dataset.kid, parseInt(b.dataset.s), b.dataset.n);
    }
  });
}

// SCHULE
function rSchule() {
  const nf=gNF();
  let h = `<div style="color:white;font-weight:800;font-size:15px;margin-bottom:7px">Schule - Alia</div>`;
  if (nf.length) {
    const f=nf[0], du=dU(f.v);
    if (du<=14) h += `<div style="background:${du<=0?"#c8e6c9":"#fff3e0"};border-radius:13px;padding:12px 14px;margin-bottom:8px;border-left:5px solid ${du<=0?"#4caf50":"#ff9800"}"><div style="font-weight:800;font-size:13px;color:${du<=0?"#2e7d32":"#e65100"}">${f.n}${du<=0?" - Schulfrei!":" in "+du+" Tagen!"}</div><div style="font-size:11px;color:#666;margin-top:2px">${fmtD(f.v)} - ${fmtD(f.b)}</div></div>`;
  }
  h += `<div class="card"><div class="ct">Stundenplan</div><div class="sg">`;
  h += `<div class="sc sh">Zeit</div>${SP.t.map(t=>`<div class="sc sh">${t}</div>`).join("")}`;
  SP.z.forEach((z,zi) => {
    h += `<div class="sc sm">${z}</div>`;
    SP.t.forEach((t,ti) => {
      const fa=SP.f[zi]?SP.f[zi][ti]:"";
      h += `<div class="sc sf ${fa?FC[fa]||"fsk":"ff"}">${fa}</div>`;
    });
  });
  h += `</div><div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:3px">`;
  Object.entries(FC).forEach(([f,c]) => {
    h += `<span style="background:${FCC[c]};color:white;border-radius:4px;padding:1px 6px;font-size:9px;font-weight:700">${f}</span>`;
  });
  h += `</div></div>`;
  h += `<div style="color:white;font-weight:800;font-size:14px;margin-bottom:7px">Kommende Ferien</div>`;
  nf.forEach(f => {
    const du=dU(f.v), lauf=du<=0;
    h += `<div class="fc" style="border-left:5px solid ${lauf?"#4caf50":du<=14?"#ff9800":"#764ba2"}"><div style="flex:1"><div style="font-weight:800;font-size:13px">${f.n}</div><div style="font-size:11px;color:#888;margin-top:1px">${fmtD(f.v)} - ${fmtD(f.b)}</div></div><span style="background:${lauf?"#c8e6c9":du<=14?"#ffe0b2":"#ede7f6"};color:${lauf?"#2e7d32":du<=14?"#e65100":"#764ba2"};border-radius:8px;padding:4px 9px;font-size:11px;font-weight:800;white-space:nowrap">${lauf?"Jetzt!":du+"d"}</span></div>`;
  });
  document.getElementById("t-schule").innerHTML = h;
}

// TERMINE
function saveApt() {
  const ti=document.getElementById("nati")?.value.trim(); if(!ti)return;
  W.apts.push({id:Date.now(),day:document.getElementById("nad")?.value,time:document.getElementById("nat")?.value,title:ti,who:document.getElementById("naw")?.value||"Familie",color:"#26a69a"});
  W.showAF=false; sv(); rTermine();
}
function saveRec(id) {
  const r=W.rec.find(x=>x.id===id); if(!r)return;
  r.day=document.getElementById("red")?.value; r.time=document.getElementById("ret")?.value;
  r.title=document.getElementById("reti")?.value; r.who=document.getElementById("rew2")?.value;
  W.recEdit=null; sv(); rTermine();
}
function rTermine() {
  const d=DAYS[W.day], dr=W.rec.filter(r=>r.day===d), de=W.apts.filter(a=>a.day===d);
  let h = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><div style="color:white;font-weight:800;font-size:15px">${DAYSF[W.day]}</div><button data-toggle-af="1" style="background:white;color:#764ba2;border:none;border-radius:9px;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer">+ Termin</button></div>`;
  if (W.showAF) {
    h += `<div class="card"><div class="ct">Neuer Termin</div><div style="display:flex;gap:6px;margin-bottom:6px"><select id="nad" style="flex:1;padding:7px;border-radius:8px;border:2px solid #eee;font-size:12px">${DAYS.map(x=>`<option${x===d?" selected":""}>${x}</option>`).join("")}</select><input id="nat" style="flex:1;padding:7px;border-radius:8px;border:2px solid #eee;font-size:12px" placeholder="Zeit"></div><input id="nati" class="fi" placeholder="Termin"><input id="naw" class="fi" placeholder="Wer?"><button data-save-apt="1" class="sb">Speichern</button></div>`;
  }
  if (dr.length) {
    h += `<div style="color:rgba(255,255,255,0.7);font-size:10px;font-weight:700;margin-bottom:5px;letter-spacing:1px">JEDE WOCHE (tippen = bearbeiten)</div>`;
    dr.forEach(r => {
      if (W.recEdit===r.id) {
        h += `<div class="card"><div class="ct">Bearbeiten</div><div style="display:flex;gap:6px;margin-bottom:6px"><select id="red" style="flex:1;padding:7px;border-radius:8px;border:2px solid #eee;font-size:12px">${DAYS.map(x=>`<option${x===r.day?" selected":""}>${x}</option>`).join("")}</select><input id="ret" value="${r.time}" style="flex:1;padding:7px;border-radius:8px;border:2px solid #eee;font-size:12px"></div><input id="reti" value="${r.title}" class="fi"><input id="rew2" value="${r.who}" class="fi"><div style="display:flex;gap:6px"><button data-rec-save="${r.id}" class="sb" style="flex:1;margin:0">Speichern</button><button data-rec-del="${r.id}" style="flex:1;background:#ffebee;color:#f44336;border:none;border-radius:9px;padding:9px;font-weight:800;cursor:pointer">Loeschen</button></div></div>`;
      } else {
        h += `<div data-rec-edit="${r.id}" style="background:white;border-radius:13px;padding:10px 13px;margin-bottom:6px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 12px rgba(0,0,0,0.1);border-left:5px solid ${r.color};cursor:pointer"><div style="flex:1"><div style="font-weight:800;font-size:13px">${r.title}</div><div style="font-size:11px;color:#888">${r.time} - ${r.who}</div></div><span style="font-size:10px;color:#ccc">&#9998;</span></div>`;
      }
    });
  }
  if (de.length) {
    h += `<div style="color:rgba(255,255,255,0.7);font-size:10px;font-weight:700;margin-bottom:5px;margin-top:8px;letter-spacing:1px">EINMALIG</div>`;
    de.forEach(a => {
      h += `<div style="background:white;border-radius:13px;padding:10px 13px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 3px 12px rgba(0,0,0,0.1);border-left:5px solid ${a.color}"><div><div style="font-weight:800;font-size:13px">${a.title}</div><div style="font-size:11px;color:#888">${a.time?" "+a.time+" - ":""}${a.who}</div></div><button data-apt-del="${a.id}" class="dlb">x</button></div>`;
    });
  }
  if (!dr.length&&!de.length) h += `<div class="eb">Keine Termine heute</div>`;
  h += `<div style="color:white;font-weight:800;font-size:14px;margin-top:14px;margin-bottom:7px">Ganze Woche</div><div class="card">`;
  DAYS.forEach(dd => {
    const all=[...W.rec.filter(r=>r.day===dd),...W.apts.filter(a=>a.day===dd)];
    h += `<div class="wr"><div style="width:24px;font-weight:900;font-size:11px;color:#764ba2;padding-top:2px;flex-shrink:0">${dd}</div><div class="wt">`;
    if (all.length) all.forEach(a => { h += `<span class="wtg" style="background:${(a.color||"#764ba2")}15;color:${a.color||"#764ba2"}">${a.title}</span>`; });
    else h += `<span style="font-size:10px;color:#ddd">frei</span>`;
    h += `</div></div>`;
  });
  h += `</div>`;
  document.getElementById("t-termine").innerHTML = h;
}

// EINKAUF
function rEinkauf() {
  let h = `<div style="color:white;font-weight:800;font-size:15px;margin-bottom:7px">Einkaufsliste</div><div style="background:rgba(255,255,255,0.18);border-radius:10px;padding:6px 11px;color:white;font-size:11px;margin-bottom:7px">Aliana Kernkraft Leinoel nicht vergessen!</div>`;
  SHOP.forEach((cat,ci) => {
    const dn=cat.i.filter((x,ii)=>W.chk[ci+"-"+ii]).length;
    h += `<div class="card" style="${dn===cat.i.length?"opacity:.7":""}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><div class="ct" style="margin:0">${cat.c}</div><span style="font-size:10px;font-weight:700;color:${dn===cat.i.length?"#4caf50":"#aaa"}">${dn===cat.i.length?"Fertig":dn+"/"+cat.i.length}</span></div>`;
    cat.i.forEach((x,ii) => {
      const k=`${ci}-${ii}`, c=W.chk[k];
      h += `<div class="si" data-chk="${k}"><div class="chkbox${c?" on":""}">${c?"v":""}</div><span style="font-size:12px;color:${c?"#bbb":"#333"};text-decoration:${c?"line-through":"none"}">${x}</span></div>`;
    });
    h += `</div>`;
  });
  document.getElementById("t-einkauf").innerHTML = h;
}

// SPORT
function saveSched() {
  const ti=document.getElementById("nsti")?.value.trim(); if(!ti)return;
  W.sched.push({id:"u"+Date.now(),day:document.getElementById("nsd")?.value,type:document.getElementById("nst")?.value,title:ti,who:document.getElementById("nstw")?.value||"Familie"});
  W.showSF=false; sv(); rSport();
}
function rSport() {
  const d=DAYS[W.day], its=W.sched.filter(s=>s.day===d);
  let h = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><div style="color:white;font-weight:800;font-size:15px">Bewegung - ${d}</div><button data-toggle-sf="1" style="background:white;color:#764ba2;border:none;border-radius:9px;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer">+ Aktivitaet</button></div>`;
  if (W.showSF) {
    h += `<div class="card"><div class="ct">Neue Aktivitaet</div><div style="display:flex;gap:6px;margin-bottom:6px"><select id="nsd" style="flex:1;padding:7px;border-radius:8px;border:2px solid #eee;font-size:12px">${DAYS.map(x=>`<option${x===d?" selected":""}>${x}</option>`).join("")}</select><select id="nst" style="flex:1;padding:7px;border-radius:8px;border:2px solid #eee;font-size:12px"><option value="training">Training</option><option value="lernen">Lernen</option><option value="ruhe">Ruhe</option></select></div><input id="nsti" class="fi" placeholder="Titel (z.B. Fussball, Wandern)"><input id="nstw" class="fi" placeholder="Wer?"><button data-save-sched="1" class="sb">Speichern</button></div>`;
  }
  if (!its.length) h += `<div class="eb">Freier Tag</div>`;
  its.forEach(s => {
    const c=TC[s.type];
    h += `<div class="spk" style="background:${c.bg};border-color:${c.bd}"><div style="display:flex;align-items:center;gap:7px"><div style="flex:1"><div style="font-weight:800;font-size:13px;color:${c.tx}">${s.title}</div><div style="font-size:10px;color:${c.tx};opacity:.7">${s.who}</div></div><span style="background:${c.bd}30;color:${c.tx};border-radius:6px;padding:2px 6px;font-size:9px;font-weight:700">${c.lb}</span><button data-sched-del="${s.id}" class="dlb">x</button></div></div>`;
  });
  h += `<div style="color:white;font-weight:800;font-size:14px;margin-top:12px;margin-bottom:7px">Wochenplan</div><div class="card">`;
  DAYS.forEach(dd => {
    const i2=W.sched.filter(s=>s.day===dd);
    h += `<div class="wr"><div style="width:24px;font-weight:900;font-size:11px;color:#764ba2;padding-top:2px;flex-shrink:0">${dd}</div><div class="wt">`;
    if (i2.length) i2.forEach(s => { const c=TC[s.type]; h += `<span class="wtg" style="background:${c.bg};color:${c.tx}">${s.title}</span>`; });
    else h += `<span style="font-size:10px;color:#ddd">Frei</span>`;
    h += `</div></div>`;
  });
  h += `</div>`;
  document.getElementById("t-sport").innerHTML = h;
}

ld();
showScr("start");
